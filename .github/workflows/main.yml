name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Limpar base Android e React Native
      run: |
        git remote add upstream https://github.com/Geocld/XStreaming.git || true
        git fetch upstream main
        git checkout upstream/main -- android/ package.json yarn.lock src/
        echo "" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Rust & Android NDK 23.1.7779620
      run: |
        set +e
        set +o pipefail
        rustup default stable
        rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"
        if [ -d "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64" ]; then
          ln -sf "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64" "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/darwin-x86_64"
        fi
        exit 0

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Aplicar Ultra-Lite, Tema play.xbox.com e Atalhos na TV
      run: |
        node << 'EOF'
        const fs = require('fs');
        const path = require('path');

        function walk(dir, callback) {
          if (!fs.existsSync(dir)) return;
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) walk(p, callback);
            else callback(p);
          }
        }

        // 1. Criar TvShortcutHelper.java universal (sem dependencias externas de compilacao)
        const helperPath = 'android/app/src/main/java/com/xstreaming/TvShortcutHelper.java';
        const helperCode = `package com.xstreaming;
        import android.app.Activity;
        import android.content.ComponentName;
        import android.content.ContentUris;
        import android.content.ContentValues;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentSender;
        import android.content.SharedPreferences;
        import android.content.pm.PackageManager;
        import android.content.pm.ShortcutInfo;
        import android.content.pm.ShortcutManager;
        import android.graphics.drawable.Icon;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Handler;
        import android.os.Looper;
        import android.widget.Toast;
        import java.util.Collections;

        public class TvShortcutHelper {
            public static Context sAppContext;

            public static boolean isSupported(Object obj) {
                if (obj instanceof Context) {
                    sAppContext = ((Context) obj).getApplicationContext();
                }
                return true;
            }

            public static void handleIncomingIntent(Activity activity) {
                if (activity == null) return;
                sAppContext = activity.getApplicationContext();
                try {
                    Intent intent = activity.getIntent();
                    if (intent == null) return;
                    ComponentName comp = intent.getComponent();
                    if (comp != null && comp.getClassName() != null && comp.getClassName().startsWith("com.xstreaming.TvGameSlot")) {
                        String slotKey = comp.getClassName().substring("com.xstreaming.".length());
                        SharedPreferences prefs = activity.getSharedPreferences("tv_game_slots", Context.MODE_PRIVATE);
                        String savedUri = prefs.getString(slotKey + "_uri", null);
                        if (savedUri != null) {
                            Intent gameIntent = Intent.parseUri(savedUri, Intent.URI_INTENT_SCHEME);
                            activity.setIntent(gameIntent);
                        }
                    }
                } catch (Exception ignored) {}
            }

            public static void pinQuickShortcut(Activity activity) {
                if (activity == null) return;
                sAppContext = activity.getApplicationContext();
                if (Build.VERSION.SDK_INT >= 26) {
                    try {
                        ShortcutManager sm = activity.getSystemService(ShortcutManager.class);
                        Intent launchIntent = new Intent(activity, MainActivity.class);
                        launchIntent.setAction(Intent.ACTION_VIEW);
                        String id = "xbox_tv_" + (System.currentTimeMillis() / 60000);
                        ShortcutInfo info = new ShortcutInfo.Builder(activity, id)
                            .setShortLabel("Xbox Cloud")
                            .setLongLabel("Abrir Xbox Cloud Gaming")
                            .setIcon(Icon.createWithResource(activity, activity.getApplicationInfo().icon))
                            .setIntent(launchIntent)
                            .build();
                        pinOnTv(sm, info, null);
                    } catch (Exception ignored) {}
                }
            }

            public static boolean pinCompatOnTv(Object ctxObj, Object infoCompat, IntentSender sender) {
                if (ctxObj instanceof Context) {
                    sAppContext = ((Context) ctxObj).getApplicationContext();
                }
                try {
                    if (infoCompat != null && Build.VERSION.SDK_INT >= 26) {
                        Object si = infoCompat.getClass().getMethod("toShortcutInfo").invoke(infoCompat);
                        ShortcutManager sm = sAppContext != null ? sAppContext.getSystemService(ShortcutManager.class) : null;
                        return pinOnTv(sm, si, sender);
                    }
                } catch (Exception ignored) {}
                return true;
            }

            public static boolean pinOnTv(Object smObj, Object infoObj, IntentSender sender) {
                if (smObj instanceof Context) {
                    sAppContext = ((Context) smObj).getApplicationContext();
                }
                if (Build.VERSION.SDK_INT < 26 || !(infoObj instanceof ShortcutInfo)) return true;
                ShortcutInfo info = (ShortcutInfo) infoObj;
                try {
                    ShortcutManager sm = (smObj instanceof ShortcutManager)
                        ? (ShortcutManager) smObj
                        : (sAppContext != null ? sAppContext.getSystemService(ShortcutManager.class) : null);
                    if (sm != null) {
                        sm.addDynamicShortcuts(Collections.singletonList(info));
                        try { sm.requestPinShortcut(info, sender); } catch (Exception ignored) {}
                    }
                } catch (Exception ignored) {}
                Context ctx = sAppContext;
                if (ctx != null) {
                    String id = info.getId() != null ? info.getId() : "game_" + System.currentTimeMillis();
                    String title = info.getShortLabel() != null ? info.getShortLabel().toString() : "Jogo Xbox";
                    Intent launchIntent = info.getIntent();
                    if (launchIntent == null) {
                        launchIntent = new Intent(ctx, MainActivity.class);
                        launchIntent.setAction(Intent.ACTION_VIEW);
                    }
                    launchIntent.setPackage(ctx.getPackageName());
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                    String intentUri = launchIntent.toUri(Intent.URI_INTENT_SCHEME);
                    String posterUri = "https://compass-ssl.xbox.com/assets/16/9a/169a7d4c-2560-4f42-b197-11257b42b93e.jpg";
                    publishToWatchNext(ctx, id, title, posterUri, intentUri);
                    publishToTvChannel(ctx, id, title, posterUri, intentUri);
                    enableAppRowSlot(ctx, title, intentUri);
                    final String finalTitle = title;
                    final Context finalCtx = ctx;
                    new Handler(Looper.getMainLooper()).post(new Runnable() {
                        @Override
                        public void run() {
                            Toast.makeText(finalCtx, "Atalho de '" + finalTitle + "' adicionado na Tela Inicial da TV!", Toast.LENGTH_LONG).show();
                        }
                    });
                }
                return true;
            }

            private static void publishToWatchNext(Context ctx, String id, String title, String posterUri, String intentUri) {
                try {
                    ContentValues values = new ContentValues();
                    values.put("type", 0);
                    values.put("watch_next_type", 0);
                    values.put("last_engagement_time_utc_millis", System.currentTimeMillis());
                    values.put("title", title);
                    values.put("short_description", "Xbox Cloud Gaming - Abrir jogo direto");
                    values.put("poster_art_uri", posterUri);
                    values.put("poster_art_aspect_ratio", 4);
                    values.put("intent_uri", intentUri);
                    values.put("internal_provider_id", id);
                    ctx.getContentResolver().insert(Uri.parse("content://android.media.tv/watch_next_program"), values);
                } catch (Exception ignored) {}
            }

            private static void publishToTvChannel(Context ctx, String id, String title, String posterUri, String intentUri) {
                try {
                    SharedPreferences prefs = ctx.getSharedPreferences("tv_game_slots", Context.MODE_PRIVATE);
                    long channelId = prefs.getLong("xbox_channel_id", -1L);
                    if (channelId == -1L) {
                        ContentValues cv = new ContentValues();
                        cv.put("type", "TYPE_PREVIEW");
                        cv.put("display_name", "Meus Jogos Xbox");
                        cv.put("description", "Atalhos de jogos do Xbox Cloud Gaming");
                        Intent mainIntent = new Intent(ctx, MainActivity.class);
                        cv.put("app_link_intent_uri", mainIntent.toUri(Intent.URI_INTENT_SCHEME));
                        Uri chUri = ctx.getContentResolver().insert(Uri.parse("content://android.media.tv/channel"), cv);
                        if (chUri != null) {
                            channelId = ContentUris.parseId(chUri);
                            prefs.edit().putLong("xbox_channel_id", channelId).apply();
                            try {
                                Class.forName("android.media.tv.TvContract")
                                    .getMethod("requestChannelBrowsable", Context.class, long.class)
                                    .invoke(null, ctx, channelId);
                            } catch (Exception ignored) {}
                        }
                    }
                    if (channelId != -1L) {
                        ContentValues pv = new ContentValues();
                        pv.put("channel_id", channelId);
                        pv.put("type", 0);
                        pv.put("title", title);
                        pv.put("short_description", "Xbox Cloud Gaming");
                        pv.put("poster_art_uri", posterUri);
                        pv.put("poster_art_aspect_ratio", 4);
                        pv.put("intent_uri", intentUri);
                        pv.put("internal_provider_id", id);
                        pv.put("weight", 100);
                        ctx.getContentResolver().insert(Uri.parse("content://android.media.tv/preview_program"), pv);
                    }
                } catch (Exception ignored) {}
            }

            private static void enableAppRowSlot(Context ctx, String title, String intentUri) {
                try {
                    SharedPreferences prefs = ctx.getSharedPreferences("tv_game_slots", Context.MODE_PRIVATE);
                    int nextSlot = (prefs.getInt("last_slot", 0) % 5) + 1;
                    String slotKey = "TvGameSlot" + nextSlot;
                    prefs.edit().putInt("last_slot", nextSlot).putString(slotKey + "_uri", intentUri).putString(slotKey + "_title", title).apply();
                    ComponentName comp = new ComponentName(ctx.getPackageName(), "com.xstreaming." + slotKey);
                    ctx.getPackageManager().setComponentEnabledSetting(comp, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);
                } catch (Exception ignored) {}
            }
        }
        `;
        fs.mkdirSync(path.dirname(helperPath), { recursive: true });
        fs.writeFileSync(helperPath, helperCode, 'utf8');

        // 2. Otimizar MediaCodec e conectar ShortcutManager apenas onde ShortcutManager existir
        walk('android/app/src/main/java', (p) => {
          if (!p.endsWith('.java') || p.endsWith('TvShortcutHelper.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          c = c.replace(/MediaFormat\.KEY_PRIORITY,\s*0/g, 'MediaFormat.KEY_PRIORITY, 1');
          c = c.replace(/KEY_OPERATING_RATE,\s*Short\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          c = c.replace(/KEY_OPERATING_RATE,\s*Integer\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          if (c.includes('ShortcutManager')) {
            c = c.replace(/\b([a-z]\w*)\.isRequestPinShortcutSupported\s*\(\s*\)/g, 'com.xstreaming.TvShortcutHelper.isSupported($1)');
            c = c.replace(/\bShortcutManagerCompat\.isRequestPinShortcutSupported\s*\(/g, 'com.xstreaming.TvShortcutHelper.isSupported(');
            c = c.replace(/\b([a-z]\w*)\.requestPinShortcut\s*\(/g, 'com.xstreaming.TvShortcutHelper.pinOnTv($1, ');
            c = c.replace(/\bShortcutManagerCompat\.requestPinShortcut\s*\(/g, 'com.xstreaming.TvShortcutHelper.pinCompatOnTv(');
          }
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 3. Desativar Controles Virtuais, FSR, FrameGen e Giroscopio (Zero GPU / Zero RAM)
        walk('android/app/src/main/java/com/xstreaming/touchcontrols', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          c = c.replace(/(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)/g, '$1 setVisibility(android.view.View.GONE); if (true) return;');
          c = c.replace(/(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)/g, '$1 if (true) return false;');
          fs.writeFileSync(p, c, 'utf8');
        });

        ['fsr', 'framegen', 'sensor'].forEach((sub) => {
          walk(path.join('android/app/src/main/java/com/xstreaming', sub), (p) => {
            if (!p.endsWith('.java')) return;
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(/(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)/g, '$1 $2 = false;');
            c = c.replace(/(public\s+void\s+onSensorChanged\s*\([^)]*\)\s*\{)/g, '$1 if (true) return;');
            fs.writeFileSync(p, c, 'utf8');
          });
        });

        // 4. Esvaziar JS legado de WebView e reduzir Splash PNGs para 68 bytes
        walk('android/app/src/main/assets/stream/assets', (p) => {
          if (p.includes('legacy') && p.endsWith('.js')) fs.writeFileSync(p, '', 'utf8');
        });

        const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
        ['android/app/src/main/res', 'src'].forEach((folder) => {
          walk(folder, (p) => {
            const low = path.basename(p).toLowerCase();
            if (['screen.png', 'screen_land.png', 'bg.png', 'background.png', 'bg.jpg', 'gamepad_bg.png'].includes(low)) {
              fs.writeFileSync(p, tinyPng);
            }
          });
        });

        // 5. Aplicar Tema Oficial play.xbox.com (#0e0e0e e #107C10)
        const blueAccents = ['#2088ff','#2088FF','#1890ff','#1890FF','#007aff','#007AFF','#2196f3','#2196F3','#0088ff','#0088FF','#3880ff','#3880FF','#409eff','#409EFF','#0066cc','#0078d4','#0078D4','#6750a4','#6750A4'];
        const darkBgs = ['#1a1b2e','#1A1B2E','#161726','#161622','#1e1e2e','#1E1E2E','#181825','#191a2c','#121324','#151625','#1c1d30','#141526','#1b1c2e','#202235','#24273a','#1f2033','#11121e'];
        walk('src', (p) => {
          if (!/\.(ts|tsx|js|jsx|json)$/.test(p)) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          blueAccents.forEach((h) => { c = c.split(h).join('#107C10'); });
          darkBgs.forEach((h) => { c = c.split(h).join('#0e0e0e'); });
          c = c.split('"Jump back in"').join('"Voltar ao jogo"').split("'Jump back in'").join("'Voltar ao jogo'");
          c = c.split('"Recently Added"').join('"Adicionados recentemente"').split("'Recently Added'").join("'Adicionados recentemente'");
          c = c.split('"Show all"').join('"Mostrar tudo"').split("'Show all'").join("'Mostrar tudo'");
          c = c.split('"Find games"').join('"Pesquisar jogos"').split("'Find games'").join("'Pesquisar jogos'");
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 6. Remover arquiteturas x86 / x86_64 do build.gradle
        const bgPath = 'android/app/build.gradle';
        if (fs.existsSync(bgPath)) {
          let bg = fs.readFileSync(bgPath, 'utf8');
          bg = bg.replace(/"x86",\s*"x86_64",\s*/g, '').replace(/'x86',\s*'x86_64',\s*/g, '');
          fs.writeFileSync(bgPath, bg, 'utf8');
        }

        // 7. Adicionar permissoes e Slots de Atalhos LEANBACK_LAUNCHER no AndroidManifest.xml
        const manPath = 'android/app/src/main/AndroidManifest.xml';
        if (fs.existsSync(manPath)) {
          let man = fs.readFileSync(manPath, 'utf8');
          if (!man.includes('INSTALL_SHORTCUT')) {
            man = man.replace('<application', '<uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />\n    <uses-permission android:name="com.android.providers.tv.permission.READ_EPG_DATA" />\n    <uses-permission android:name="com.android.providers.tv.permission.WRITE_EPG_DATA" />\n    <application');
          }
          if (!man.includes('LEANBACK_LAUNCHER')) {
            man = man.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />');
          }
          if (!man.includes('TvGameSlot1')) {
            let aliases = '';
            for (let i = 1; i <= 5; i++) {
              aliases += `\n        <activity-alias android:name=".TvGameSlot${i}" android:targetActivity=".MainActivity" android:label="Xbox Jogo ${i}" android:enabled="false" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity-alias>`;
            }
            man = man.replace('</application>', aliases + '\n    </application>');
          }
          fs.writeFileSync(manPath, man, 'utf8');
        }

        // 8. Injetar TvShortcutHelper, Atalho L3+R3 e Filtro de 1000Hz do Dongle GameSir na MainActivity.java
        const mainAct = 'android/app/src/main/java/com/xstreaming/MainActivity.java';
        if (fs.existsSync(mainAct)) {
          let code = fs.readFileSync(mainAct, 'utf8');
          code = code.replace(/(super\.onCreate\s*\([^)]*\)\s*;)/, '$1 com.xstreaming.TvShortcutHelper.handleIncomingIntent(this);');
          code = code.replace(/(super\.onNewIntent\s*\([^)]*\)\s*;)/, '$1 com.xstreaming.TvShortcutHelper.handleIncomingIntent(this);');
          if (!code.includes('_lastMotionTime') && !code.includes('dispatchGenericMotionEvent')) {
            const filterMethod = `
            private float _lastLX = 0f, _lastLY = 0f, _lastRX = 0f, _lastRY = 0f, _lastLT = 0f, _lastRT = 0f, _lastHatX = 0f, _lastHatY = 0f;
            private long _lastMotionTime = 0L;
            private boolean _wasCentered = true;
            private boolean _l3Down = false, _r3Down = false;
            @Override
            public boolean dispatchKeyEvent(android.view.KeyEvent event) {
                if (event != null) {
                    int keyCode = event.getKeyCode();
                    boolean isDown = event.getAction() == android.view.KeyEvent.ACTION_DOWN;
                    if (keyCode == android.view.KeyEvent.KEYCODE_BUTTON_THUMBL) _l3Down = isDown;
                    if (keyCode == android.view.KeyEvent.KEYCODE_BUTTON_THUMBR) _r3Down = isDown;
                    if (_l3Down && _r3Down && isDown) {
                        _l3Down = false; _r3Down = false;
                        com.xstreaming.TvShortcutHelper.pinQuickShortcut(this);
                        return true;
                    }
                }
                return super.dispatchKeyEvent(event);
            }
            @Override
            public boolean dispatchGenericMotionEvent(android.view.MotionEvent event) {
                com.xstreaming.TvShortcutHelper.sAppContext = getApplicationContext();
                if (event != null && (event.getSource() & android.view.InputDevice.SOURCE_JOYSTICK) == android.view.InputDevice.SOURCE_JOYSTICK && event.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                    float lx = event.getAxisValue(android.view.MotionEvent.AXIS_X);
                    float ly = event.getAxisValue(android.view.MotionEvent.AXIS_Y);
                    float rx = event.getAxisValue(android.view.MotionEvent.AXIS_Z);
                    float ry = event.getAxisValue(android.view.MotionEvent.AXIS_RZ);
                    float lt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_LTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_BRAKE));
                    float rt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_RTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_GAS));
                    float hatX = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_X);
                    float hatY = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_Y);
                    boolean isCentered = Math.abs(lx) < 0.08f && Math.abs(ly) < 0.08f && Math.abs(rx) < 0.08f && Math.abs(ry) < 0.08f && lt < 0.05f && rt < 0.05f;
                    boolean hatChanged = Float.compare(hatX, _lastHatX) != 0 || Float.compare(hatY, _lastHatY) != 0;
                    long now = android.os.SystemClock.uptimeMillis();
                    if (!hatChanged) {
                        if (isCentered) {
                            if (_wasCentered) return true;
                            _wasCentered = true;
                        } else {
                            _wasCentered = false;
                            if (now - _lastMotionTime < 14L) return true;
                            if (Math.abs(lx - _lastLX) < 0.015f && Math.abs(ly - _lastLY) < 0.015f && Math.abs(rx - _lastRX) < 0.015f && Math.abs(ry - _lastRY) < 0.015f && Math.abs(lt - _lastLT) < 0.02f && Math.abs(rt - _lastRT) < 0.02f) return true;
                        }
                    }
                    _lastHatX = hatX; _lastHatY = hatY;
                    _lastLX = lx; _lastLY = ly; _lastRX = rx; _lastRY = ry; _lastLT = lt; _lastRT = rt;
                    _lastMotionTime = now;
                }
                return super.dispatchGenericMotionEvent(event);
            }
        }`;
            const lastBrace = code.lastIndexOf('}');
            if (lastBrace !== -1) {
              code = code.slice(0, lastBrace) + filterMethod + '\n';
              fs.writeFileSync(mainAct, code, 'utf8');
            }
          }
        }
        EOF

    - name: Configure Signing
      run: |
        cat << 'EOF' > /tmp/init.gradle
        allprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        buildTypes {
                            release {
                                signingConfig signingConfigs.debug
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleProdRelease -x lint -x test --init-script /tmp/init.gradle || ./gradlew assembleRelease -x lint -x test --init-script /tmp/init.gradle

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XStreaming-TV-UltraLite-APK
        path: android/app/build/outputs/apk/**/*.apk
