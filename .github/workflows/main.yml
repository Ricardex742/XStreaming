name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Limpar base Android e React Native
      run: |
        git remote add upstream https://github.com/Geocld/XStreaming.git || true
        git fetch upstream main
        git checkout upstream/main -- android/ package.json yarn.lock src/
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

    - name: Aplicar Modo Ultra-Leve, Tema play.xbox.com e Atalhos na TV
      shell: python
      run: |
        import os, re, base64

        # 1.Criar TvShortcutHelper.java 100% compativel com Android SDK padrao
        helper_path = "android/app/src/main/java/com/xstreaming/TvShortcutHelper.java"
        helper_lines = [
            "package com.xstreaming;",
            "import android.app.Activity;",
            "import android.content.ComponentName;",
            "import android.content.ContentUris;",
            "import android.content.ContentValues;",
            "import android.content.Context;",
            "import android.content.Intent;",
            "import android.content.IntentSender;",
            "import android.content.SharedPreferences;",
            "import android.content.pm.PackageManager;",
            "import android.content.pm.ShortcutInfo;",
            "import android.content.pm.ShortcutManager;",
            "import android.media.tv.TvContract;",
            "import android.net.Uri;",
            "import android.os.Build;",
            "import android.os.Handler;",
            "import android.os.Looper;",
            "import android.widget.Toast;",
            "import java.util.Collections;",
            "public class TvShortcutHelper {",
            "    public static Context sAppContext;",
            "    public static boolean isSupported(Object smOrCtx) {",
            "        if (smOrCtx instanceof Context) sAppContext = ((Context) smOrCtx).getApplicationContext();",
            "        return true;",
            "    }",
            "    public static void handleIncomingIntent(Activity activity) {",
            "        if (activity == null) return;",
            "        sAppContext = activity.getApplicationContext();",
            "        try {",
            "            Intent intent = activity.getIntent();",
            "            if (intent == null) return;",
            "            ComponentName comp = intent.getComponent();",
            "            if (comp != null && comp.getClassName() != null && comp.getClassName().startsWith(\"com.xstreaming.TvGameSlot\")) {",
            "                String slotKey = comp.getClassName().substring(\"com.xstreaming.\".length());",
            "                SharedPreferences prefs = activity.getSharedPreferences(\"tv_game_slots\", Context.MODE_PRIVATE);",
            "                String savedUri = prefs.getString(slotKey + \"_uri\", null);",
            "                if (savedUri != null) {",
            "                    Intent gameIntent = Intent.parseUri(savedUri, Intent.URI_INTENT_SCHEME);",
            "                    activity.setIntent(gameIntent);",
            "                }",
            "            }",
            "        } catch (Exception ignored) {}",
            "    }",
            "    public static boolean pinCompatOnTv(Context ctx, Object infoCompat, IntentSender sender) {",
            "        if (ctx != null) sAppContext = ctx.getApplicationContext();",
            "        try {",
            "            if (infoCompat != null && Build.VERSION.SDK_INT >= 26) {",
            "                Object si = infoCompat.getClass().getMethod(\"toShortcutInfo\").invoke(infoCompat);",
            "                if (si instanceof ShortcutInfo) {",
            "                    ShortcutManager sm = ctx != null ? ctx.getSystemService(ShortcutManager.class) : null;",
            "                    return pinOnTv(sm, (ShortcutInfo) si, sender);",
            "                }",
            "            }",
            "        } catch (Exception ignored) {}",
            "        return true;",
            "    }",
            "    public static boolean pinOnTv(ShortcutManager sm, ShortcutInfo info, IntentSender sender) {",
            "        if (info == null) return false;",
            "        try {",
            "            if (sm != null && Build.VERSION.SDK_INT >= 26) {",
            "                sm.addDynamicShortcuts(Collections.singletonList(info));",
            "                try { sm.requestPinShortcut(info, sender); } catch (Exception ignored) {}",
            "            }",
            "        } catch (Exception ignored) {}",
            "        Context ctx = sAppContext;",
            "        if (ctx != null) {",
            "            String id = info.getId() != null ? info.getId() : \"game_\" + System.currentTimeMillis();",
            "            String title = info.getShortLabel() != null ? info.getShortLabel().toString() : \"Jogo Xbox\";",
            "            Intent launchIntent = info.getIntent();",
            "            if (launchIntent == null) {",
            "                launchIntent = new Intent(ctx, MainActivity.class);",
            "                launchIntent.setAction(Intent.ACTION_VIEW);",
            "            }",
            "            launchIntent.setPackage(ctx.getPackageName());",
            "            launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);",
            "            String intentUri = launchIntent.toUri(Intent.URI_INTENT_SCHEME);",
            "            String posterUri = \"https://compass-ssl.xbox.com/assets/16/9a/169a7d4c-2560-4f42-b197-11257b42b93e.jpg\";",
            "            publishToWatchNext(ctx, id, title, posterUri, intentUri);",
            "            publishToTvChannel(ctx, id, title, posterUri, intentUri);",
            "            enableAppRowSlot(ctx, title, intentUri);",
            "            final String finalTitle = title;",
            "            final Context finalCtx = ctx;",
            "            new Handler(Looper.getMainLooper()).post(new Runnable() {",
            "                @Override",
            "                public void run() {",
            "                    Toast.makeText(finalCtx, \"Atalho de '\" + finalTitle + \"' adicionado na Tela Inicial da TV!\", Toast.LENGTH_LONG).show();",
            "                }",
            "            });",
            "        }",
            "        return true;",
            "    }",
            "    private static void publishToWatchNext(Context ctx, String id, String title, String posterUri, String intentUri) {",
            "        try {",
            "            ContentValues values = new ContentValues();",
            "            values.put(\"type\", 0);",
            "            values.put(\"watch_next_type\", 0);",
            "            values.put(\"last_engagement_time_utc_millis\", System.currentTimeMillis());",
            "            values.put(\"title\", title);",
            "            values.put(\"short_description\", \"Xbox Cloud Gaming - Abrir jogo direto\");",
            "            values.put(\"poster_art_uri\", posterUri);",
            "            values.put(\"poster_art_aspect_ratio\", 4);",
            "            values.put(\"intent_uri\", intentUri);",
            "            values.put(\"internal_provider_id\", id);",
            "            ctx.getContentResolver().insert(Uri.parse(\"content://android.media.tv/watch_next_program\"), values);",
            "        } catch (Exception ignored) {}",
            "    }",
            "    private static void publishToTvChannel(Context ctx, String id, String title, String posterUri, String intentUri) {",
            "        try {",
            "            SharedPreferences prefs = ctx.getSharedPreferences(\"tv_game_slots\", Context.MODE_PRIVATE);",
            "            long channelId = prefs.getLong(\"xbox_channel_id\", -1L);",
            "            if (channelId == -1L) {",
            "                ContentValues cv = new ContentValues();",
            "                cv.put(\"type\", \"TYPE_PREVIEW\");",
            "                cv.put(\"display_name\", \"Meus Jogos Xbox\");",
            "                cv.put(\"description\", \"Atalhos de jogos do Xbox Cloud Gaming\");",
            "                Intent mainIntent = new Intent(ctx, MainActivity.class);",
            "                cv.put(\"app_link_intent_uri\", mainIntent.toUri(Intent.URI_INTENT_SCHEME));",
            "                Uri chUri = ctx.getContentResolver().insert(Uri.parse(\"content://android.media.tv/channel\"), cv);",
            "                if (chUri != null) {",
            "                    channelId = ContentUris.parseId(chUri);",
            "                    prefs.edit().putLong(\"xbox_channel_id\", channelId).apply();",
            "                    if (Build.VERSION.SDK_INT >= 26) {",
            "                        TvContract.requestChannelBrowsable(ctx, channelId);",
            "                    }",
            "                }",
            "            }",
            "            if (channelId != -1L) {",
            "                ContentValues pv = new ContentValues();",
            "                pv.put(\"channel_id\", channelId);",
            "                pv.put(\"type\", 0);",
            "                pv.put(\"title\", title);",
            "                pv.put(\"short_description\", \"Xbox Cloud Gaming\");",
            "                pv.put(\"poster_art_uri\", posterUri);",
            "                pv.put(\"poster_art_aspect_ratio\", 4);",
            "                pv.put(\"intent_uri\", intentUri);",
            "                pv.put(\"internal_provider_id\", id);",
            "                pv.put(\"weight\", 100);",
            "                ctx.getContentResolver().insert(Uri.parse(\"content://android.media.tv/preview_program\"), pv);",
            "            }",
            "        } catch (Exception ignored) {}",
            "    }",
            "    private static void enableAppRowSlot(Context ctx, String title, String intentUri) {",
            "        try {",
            "            SharedPreferences prefs = ctx.getSharedPreferences(\"tv_game_slots\", Context.MODE_PRIVATE);",
            "            int nextSlot = (prefs.getInt(\"last_slot\", 0) % 5) + 1;",
            "            String slotKey = \"TvGameSlot\" + nextSlot;",
            "            prefs.edit().putInt(\"last_slot\", nextSlot).putString(slotKey + \"_uri\", intentUri).putString(slotKey + \"_title\", title).apply();",
            "            ComponentName comp = new ComponentName(ctx.getPackageName(), \"com.xstreaming.\" + slotKey);",
            "            ctx.getPackageManager().setComponentEnabledSetting(comp, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);",
            "        } catch (Exception ignored) {}",
            "    }",
            "}"
        ]
        with open(helper_path, "w", encoding="utf-8") as f:
            f.write("\n".join(helper_lines) + "\n")

        # 2. Reequilibrar MediaCodec e conectar ShortcutManager sem tocar nos parenteses de fechamento
        for root, _, files in os.walk("android/app/src/main/java"):
            for file in files:
                if file.endswith(".java") and file != "TvShortcutHelper.java":
                    p = os.path.join(root, file)
                    with open(p, "r", encoding="utf-8") as f:
                        c = f.read()
                    orig = c
                    c = c.replace("MediaFormat.KEY_PRIORITY, 0", "MediaFormat.KEY_PRIORITY, 1")
                    c = c.replace("KEY_OPERATING_RATE, Short.MAX_VALUE", "KEY_OPERATING_RATE, 60")
                    c = c.replace("KEY_OPERATING_RATE, Integer.MAX_VALUE", "KEY_OPERATING_RATE, 60")
                    c = re.sub(r'\b([a-z]\w*)\.isRequestPinShortcutSupported\s*\(\s*\)', r'com.xstreaming.TvShortcutHelper.isSupported(\1)', c)
                    c = re.sub(r'\b([a-z]\w*)\.requestPinShortcut\s*\(', r'com.xstreaming.TvShortcutHelper.pinOnTv(\1, ', c)
                    c = re.sub(r'\bShortcutManagerCompat\.isRequestPinShortcutSupported\s*\(', r'com.xstreaming.TvShortcutHelper.isSupported(', c)
                    c = re.sub(r'\bShortcutManagerCompat\.requestPinShortcut\s*\(', r'com.xstreaming.TvShortcutHelper.pinCompatOnTv(', c)
                    if c != orig:
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(c)

        # 3. Desativar completamente Controles Virtuais, Sensores de Giroscopio, FSR e FrameGen
        tc_dir = "android/app/src/main/java/com/xstreaming/touchcontrols"
        if os.path.exists(tc_dir):
            for root, _, files in os.walk(tc_dir):
                for file in files:
                    if file.endswith(".java"):
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8") as f:
                            c = f.read()
                        c = re.sub(r'(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)', r'\1 setVisibility(android.view.View.GONE); if (true) return;', c)
                        c = re.sub(r'(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)', r'\1 if (true) return false;', c)
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(c)

        for sub in ["fsr", "framegen", "sensor"]:
            d = os.path.join("android/app/src/main/java/com/xstreaming", sub)
            if os.path.exists(d):
                for root, _, files in os.walk(d):
                    for file in files:
                        if file.endswith(".java"):
                            p = os.path.join(root, file)
                            with open(p, "r", encoding="utf-8") as f:
                                c = f.read()
                            c = re.sub(r'(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)', r'\1 \2 = false;', c)
                            c = re.sub(r'(public\s+void\s+onSensorChanged\s*\([^)]*\)\s*\{)', r'\1 if (true) return;', c)
                            with open(p, "w", encoding="utf-8") as f:
                                f.write(c)

        # 4. Deletar fisicamente os arquivos JS legados de WebView em assets/stream
        stream_assets = "android/app/src/main/assets/stream/assets"
        if os.path.exists(stream_assets):
            for root, _, files in os.walk(stream_assets):
                for file in files:
                    if "legacy" in file and file.endswith(".js"):
                        try:
                            os.remove(os.path.join(root, file))
                        except Exception:
                            pass

        # 5. Substituir PNGs pesados de Splash e Marcas d'Agua por pixel escuro (#0e0e0e)
        tiny_png = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=")
        for search_folder in ["android/app/src/main/res", "src"]:
            if os.path.exists(search_folder):
                for root, _, files in os.walk(search_folder):
                    for file in files:
                        low = file.lower()
                        if low in ("screen.png", "screen_land.png", "bg.png", "background.png", "bg.jpg", "gamepad_bg.png"):
                            with open(os.path.join(root, file), "wb") as f:
                                f.write(tiny_png)

        # 6. Transformar Interface para o Tema Oficial play.xbox.com (Preto Carbono #0e0e0e e Verde Xbox #107C10)
        blue_accents = [
            "#2088ff", "#2088FF", "#1890ff", "#1890FF", "#007aff", "#007AFF",
            "#2196f3", "#2196F3", "#0088ff", "#0088FF", "#3880ff", "#3880FF",
            "#409eff", "#409EFF", "#0066cc", "#0078d4", "#0078D4", "#6750a4", "#6750A4"
        ]
        dark_blue_bgs = [
            "#1a1b2e", "#1A1B2E", "#161726", "#161622", "#1e1e2e", "#1E1E2E",
            "#181825", "#191a2c", "#121324", "#151625", "#1c1d30", "#141526",
            "#1b1c2e", "#202235", "#24273a", "#1f2033", "#11121e"
        ]
        if os.path.exists("src"):
            for root, _, files in os.walk("src"):
                for file in files:
                    if file.endswith((".ts", ".tsx", ".js", ".jsx", ".json")):
                        p = os.path.join(root, file)
                        try:
                            with open(p, "r", encoding="utf-8") as f:
                                c = f.read()
                            orig = c
                            for b_hex in blue_accents:
                                c = c.replace(b_hex, "#107C10")
                            for bg_hex in dark_blue_bgs:
                                c = c.replace(bg_hex, "#0e0e0e")
                            c = c.replace('"Jump back in"', '"Voltar ao jogo"').replace("'Jump back in'", "'Voltar ao jogo'")
                            c = c.replace('"Recently Added"', '"Adicionados recentemente"').replace("'Recently Added'", "'Adicionados recentemente'")
                            c = c.replace('"Show all"', '"Mostrar tudo"').replace("'Show all'", "'Mostrar tudo'")
                            c = c.replace('"Find games"', '"Pesquisar jogos"').replace("'Find games'", "'Pesquisar jogos'")
                            if c != orig:
                                with open(p, "w", encoding="utf-8") as f:
                                    f.write(c)
                        except Exception:
                            pass

        # 7. Remover arquiteturas de PC (x86 / x86_64) do build.gradle
        bg_path = "android/app/build.gradle"
        if os.path.exists(bg_path):
            with open(bg_path, "r", encoding="utf-8") as f:
                bg = f.read()
            bg = bg.replace('"x86", "x86_64", ', '').replace('"x86", "x86_64"', '"armeabi-v7a", "arm64-v8a"')
            bg = bg.replace("'x86', 'x86_64', ", "").replace("'x86', 'x86_64'", "'armeabi-v7a', 'arm64-v8a'")
            with open(bg_path, "w", encoding="utf-8") as f:
                f.write(bg)

        # 8. Registrar permissoes de TV e 5 Slots de Atalhos LEANBACK_LAUNCHER no AndroidManifest.xml
        manifest_path = "android/app/src/main/AndroidManifest.xml"
        if os.path.exists(manifest_path):
            with open(manifest_path, "r", encoding="utf-8") as f:
                man = f.read()
            if "INSTALL_SHORTCUT" not in man:
                perms = (
                    '<uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />\n'
                    '    <uses-permission android:name="com.android.providers.tv.permission.READ_EPG_DATA" />\n'
                    '    <uses-permission android:name="com.android.providers.tv.permission.WRITE_EPG_DATA" />\n'
                    '    <application'
                )
                man = man.replace("<application", perms, 1)
            if "LEANBACK_LAUNCHER" not in man:
                man = man.replace(
                    '<category android:name="android.intent.category.LAUNCHER" />',
                    '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
                )
            if "TvGameSlot1" not in man:
                aliases = []
                for idx in range(1, 6):
                    aliases.append(
                        f'        <activity-alias android:name=".TvGameSlot{idx}" android:targetActivity=".MainActivity" '
                        f'android:label="Xbox Jogo {idx}" android:enabled="false" android:exported="true">\n'
                        f'            <intent-filter>\n'
                        f'                <action android:name="android.intent.action.MAIN" />\n'
                        f'                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n'
                        f'                <category android:name="android.intent.category.LAUNCHER" />\n'
                        f'            </intent-filter>\n'
                        f'        </activity-alias>'
                    )
                man = man.replace("</application>", "\n".join(aliases) + "\n    </application>")
            with open(manifest_path, "w", encoding="utf-8") as f:
                f.write(man)

        # 9. Injetar TvShortcutHelper sem duplicar onNewIntent + Filtro de 1000Hz do Dongle GameSir na MainActivity
        main_act = "android/app/src/main/java/com/xstreaming/MainActivity.java"
        if os.path.exists(main_act):
            with open(main_act, "r", encoding="utf-8") as f:
                code = f.read()
            code = re.sub(
                r'(super\.onCreate\s*\([^)]*\)\s*;)',
                r'\1 com.xstreaming.TvShortcutHelper.handleIncomingIntent(this);',
                code,
                count=1
            )
            code = re.sub(
                r'(super\.onNewIntent\s*\([^)]*\)\s*;)',
                r'\1 com.xstreaming.TvShortcutHelper.
