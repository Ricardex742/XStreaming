name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restaurar base limpa e corrigir versao do CMake
      run: |
        git remote add mulyu https://github.com/Mulyu/XStreaming.git || true
        git fetch mulyu main
        git checkout mulyu/main -- android/ package.json yarn.lock src/ index.js
        git clean -fd android/ src/
        sed -i 's/3\.30\.5/3.22.1/g' android/app/build.gradle
        sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/g' android/gradle.properties
        echo "" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Android NDK 23.1.7779620 & CMake 3.22.1
      run: |
        set +e
        set +o pipefail
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"
        exit 0

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Apagar Modulos Inuteis, Remover Opcoes Circuladas e Aplicar Tema Xbox
      run: |
        node << 'EOF'
        const fs = require('fs');
        const path = require('path');

        function walk(dir, cb) {
          if (!fs.existsSync(dir)) return;
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) walk(p, cb);
            else cb(p);
          }
        }

        // 1. Esvaziar os pacotes pesados do motor WebView em assets/stream/assets
        walk('android/app/src/main/assets/stream/assets', (p) => {
          if (p.endsWith('.js') || p.endsWith('.wasm') || p.endsWith('.map')) {
            fs.writeFileSync(p, '', 'utf8');
          }
        });

        // 2. Substituir imagens pesadas de Splash e fundo por pixel escuro de 68 bytes
        const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
        ['android/app/src/main/res', 'src'].forEach((folder) => {
          walk(folder, (p) => {
            const low = path.basename(p).toLowerCase();
            if (['screen.png', 'screen_land.png', 'bg.png', 'background.png', 'bg.jpg', 'gamepad_bg.png'].includes(low)) {
              fs.writeFileSync(p, tinyPng);
            }
          });
        });

        // 3. Esvaziar classes Java de Controle Virtual, FSR, FrameGen (Lossless), Giroscopio, DualSense e PiP
        walk('android/app/src/main/java/com/xstreaming/touchcontrols', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          c = c.replace(/(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)/g, '$1 setVisibility(android.view.View.GONE); if (true) return;');
          c = c.replace(/(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)/g, '$1 if (true) return false;');
          fs.writeFileSync(p, c, 'utf8');
        });

        ['fsr', 'framegen', 'sensor', 'pip', 'dualsense', 'proxy'].forEach((sub) => {
          walk(path.join('android/app/src/main/java/com/xstreaming', sub), (p) => {
            if (!p.endsWith('.java')) return;
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(/(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)/g, '$1 $
