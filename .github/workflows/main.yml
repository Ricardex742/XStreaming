name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restaurar base limpa e otimizar para Android TV
      run: |
        git remote add upstream https://github.com/Geocld/XStreaming.git || true
        git fetch upstream main
        git checkout upstream/main -- android/ package.json yarn.lock
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Accept Android SDK Licenses & Configure Signing
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        cat << 'EOF' > /tmp/init.gradle
        allprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        buildTypes {
                            release {
                                signingConfig signingConfigs.debug
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleProdRelease -x lint -x test --init-script /tmp/init.gradle || ./gradlew assembleRelease -x lint -x test --init-script /tmp/init.gradle

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XStreaming-TV-APK
        path: android/app/build/outputs/apk/**/*.apk
