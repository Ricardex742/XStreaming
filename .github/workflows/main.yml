name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restaurar base limpa do Mulyu/XStreaming
      run: |
        git remote add mulyu https://github.com/Mulyu/XStreaming.git || true
        git fetch mulyu main
        git checkout mulyu/main -- android/ package.json yarn.lock src/ index.js
        git clean -fd android/ src/
        echo "" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
        sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/g' android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Android NDK 23.1.7779620
      run: |
        set +e
        set +o pipefail
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"
        exit 0

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Deletar Motores Pesados (C++, WebView, Nano, x86) e Remover Opcoes Circuladas
      run: |
        node << 'EOF'
        const fs = require('fs');
        const path = require('path');

        function walk(dir, cb) {
          if (!fs.existsSync(dir)) return;
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) walk(p, cb);
            else cb(p);
          }
        }

        // 1. DELETAR FISICAMENTE a pasta C++ do Lossless Scaling / FrameGen (lsfg_vendor) e pastas Rust/Nano
        ['android/app/src/main/cpp', 'rust', 'android/app/src/main/jniLibs'].forEach((dir) => {
          if (fs.existsSync(dir)) {
            fs.rmSync(dir, { recursive: true, force: true });
          }
        });

        // 2. DELETAR FISICAMENTE todas as pastas x86 e x86_64
        function removeCpuDirs(dir) {
          if (!fs.existsSync(dir)) return;
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) {
              if (f === 'x86' || f === 'x86_64') {
                fs.rmSync(p, { recursive: true, force: true });
              } else {
                removeCpuDirs(p);
              }
            }
          }
        }
        removeCpuDirs('android');
        removeCpuDirs('node_modules');

        // 3. DELETAR FISICAMENTE os arquivos do motor WebView em assets/stream/assets
        if (fs.existsSync('android/app/src/main/assets/stream/assets')) {
          fs.rmSync('android/app/src/main/assets/stream/assets', { recursive: true, force: true });
        }

        // 4. Substituir imagens pesadas de Splash e fundo por pixel escuro de 68 bytes
        const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
        ['android/app/src/main/res', 'src'].forEach((folder) => {
          walk(folder, (p) => {
            const low = path.basename(p).toLowerCase();
            if (['screen.png', 'screen_land.png', 'bg.png', 'background.png', 'bg.jpg', 'gamepad_bg.png'].includes(low)) {
              fs.writeFileSync(p, tinyPng);
            }
          });
        });

        // 5. Desativar compilacao CMake (externalNativeBuild) e ativar divisao de APK por Arquitetura no build.gradle
        const bgPath = 'android/app/build.gradle';
        if (fs.existsSync(bgPath)) {
          let bg = fs.readFileSync(bgPath, 'utf8');
          // Remover blocos externalNativeBuild que compilavam o C++ do Lossless.dll
          bg = bg.replace(/externalNativeBuild\s*\{[\s\S]*?\}\s*\}/g, '');
          bg = bg.replace(/externalNativeBuild\s*\{[^}]*\}/g, '');
          // Ativar geração de APKs separados por arquitetura (reduz de 62MB para ~24MB)
          bg = bg.replace(/def enableSeparateBuildPerCPUArchitecture = false/g, 'def enableSeparateBuildPerCPUArchitecture = true');
          bg = bg.replace(/universalApk true/g, 'universalApk false');
          bg = bg.replace(/"x86",\s*"x86_64",\s*/g, '').replace(/'x86',\s*'x86_64',\s*/g, '');
          bg = bg.replace(/,\s*"x86",\s*"x86_64"/g, '').replace(/,\s*'x86',\s*'x86_64'/g, '');
          fs.writeFileSync(bgPath, bg, 'utf8');
        }

        // 6. Esvaziar classes Java de Controle Virtual, FSR, FrameGen (Lossless), Giroscopio, DualSense e PiP
        walk('android/app/src/main/java/com/xstreaming/touchcontrols', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          c = c.replace(/(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)/g, '$1 setVisibility(android.view.View.GONE); if (true) return;');
          c = c.replace(/(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)/g, '$1 if (true) return false;');
          fs.writeFileSync(p, c, 'utf8');
        });

        ['fsr', 'framegen', 'sensor', 'pip', 'dualsense', 'proxy'].forEach((sub) => {
          walk(path.join('android/app/src/main/java/com/xstreaming', sub), (p) => {
            if (!p.endsWith('.java')) return;
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(/(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)/g, '$1 $2 = false;');
            c = c.replace(/(public\s+void\s+onSensorChanged\s*\([^)]*\)\s*\{)/g, '$1 if (true) return;');
            fs.writeFileSync(p, c, 'utf8');
          });
        });

        // 7. Proteger chamadas JNI (System.loadLibrary e metodos native) para rodar sem os .so deletados
        walk('android/app/src/main/java', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          c = c.replace(/MediaFormat\.KEY_PRIORITY,\s*0/g, 'MediaFormat.KEY_PRIORITY, 1');
          c = c.replace(/KEY_OPERATING_RATE,\s*Short\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          c = c.replace(/KEY_OPERATING_RATE,\s*Integer\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          c = c.replace(/System\.loadLibrary\s*\(\s*("[^"]+")\s*\)\s*;/g, 'try { System.loadLibrary($1); } catch (Throwable ignored) {}');
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 8. Filtro React Native para destruir da tela todas as opcoes circuladas nas 6 fotos
        const filterFile = 'src/tv_lite_filter.js';
        const filterCode = `
        const React = require('react');
        const jsxRuntime = require('react/jsx-runtime');

        const EXACT_KILL = new Set([
          'dualsense',
          'servidor intermediário',
          'servidor intermediario',
          'outros',
          'sensor',
          'streaming do console',
          'controle virtual',
          'fsr',
          'formato do vídeo',
          'formato do video',
          'picture-in-picture',
          'nano (experimental)',
          'nano',
          'webview'
        ]);

        const SUBSTR_KILL = [
          'configurar gatilho esquerdo',
          'escolha como o gatilho esquerdo',
          'configurar gatilho direito',
          'escolha como o gatilho direito',
          'servidor intermediário integrado',
          'servidor intermediario integrado',
          'usa um servidor integrado ao xstreaming',
          'servidor intermediário personalizado',
          'servidor intermediario personalizado',
          'toque nativo (experimental)',
          'ativar o toque nativo',
          'ativar giroscópio',
          'ativar giroscopio',
          'usar o giroscópio do dispositivo',
          'como ativar o giroscópio',
          'escolha se o giroscópio será ativado',
          'sensibilidade do eixo x do giroscópio',
          'ajustar a sensibilidade do movimento horizontal',
          'sensibilidade do eixo y do giroscópio',
          'ajustar a sensibilidade do movimento vertical',
          'inverter movimento do giroscópio',
          'movimento do giroscópio pode ficar invertido',
          'ligar ao iniciar o streaming',
          'escolha se deseja ligar o console',
          'servidor de conexão(xhome)',
          'servidor de conexao(xhome)',
          'este servidor ajuda a estabelecer a conexão',
          'sempre mostrar o controle virtual',
          'transparência dos botões virtuais',
          'configurar a transparência do controle virtual',
          'layout do analógico virtual',
          'escolher se o analógico virtual ficará fixo',
          'personalizar botões virtuais',
          'personalize o layout do seu controle virtual',
          'manter botões automaticamente',
          'escolha quais botões poderão ser mantidos',
          'configurações do botão macro virtual',
          'ativar o botão macro e editar sua sequência',
          'ative o fsr',
          'fidelityfx super resolution',
          'geração inteligente de quadros',
          'após importar o lossless.dll',
          'importar lossless.dll',
          'prepare um arquivo de origem legal',
          'selecione como o vídeo será exibido',
          'colocar o streaming em segundo plano abrirá o modo picture-in-picture'
        ];

        const PROTECTED_SUBSTR = [
          'resolução',
          'definir resolução',
          'ipv6',
          'priorizar conexão ipv6',
          'native: usa o sistema nativo',
          'motor de processamento',
          'teste os botões',
          'áudio',
          'salvar',
          'voltar',
          'iniciar jogo',
          'voltar ao jogo',
          'pesquisar jogos'
        ];

        function checkText(raw) {
          if (typeof raw !== 'string') return { kill: false, keep: false, count: 0 };
          const s = raw.trim().toLowerCase();
          if (!s) return { kill: false, keep: false, count: 0 };
          if (s === 'native' || s === 'configurações') return { kill: false, keep: true, count: 1 };
          for (let i = 0; i < PROTECTED_SUBSTR.length; i++) {
            if (s.includes(PROTECTED_SUBSTR[i])) return { kill: false, keep: true, count: 1 };
          }
          if (EXACT_KILL.has(s)) return { kill: true, keep: false, count: 1 };
          for (let i = 0; i < SUBSTR_KILL.length; i++) {
            if (s.includes(SUBSTR_KILL[i])) return { kill: true, keep: false, count: 1 };
          }
          return { kill: false, keep: false, count: s.length > 1 ? 1 : 0 };
        }

        function scanNode(node, state) {
          if (node == null || typeof node === 'boolean' || typeof node === 'number') return;
          if (typeof node === 'string') {
            const r = checkText(node);
            if (r.kill) state.kill = true;
            if (r.keep) state.keep = true;
            state.count += r.count;
            return;
          }
          if (Array.isArray(node)) {
            for (let i = 0; i < node.length; i++) scanNode(node[i], state);
            return;
          }
          if (typeof node === 'object') {
            if (node._killRow) state.kill = true;
            if (node._keepRow) state.keep = true;
            if (typeof node._strCount === 'number') {
              state.count += node._strCount;
            } else if (node.props) {
              scanProps(node.props, state);
            }
          }
        }

        function scanProps(props, state) {
          if (!props) return;
          const keys = ['title', 'label', 'name', 'description', 'subTitle', 'subtitle', 'header', 'text'];
          for (let i = 0; i < keys.length; i++) {
            if (typeof props[keys[i]] === 'string') {
              const r = checkText(props[keys[i]]);
              if (r.kill) state.kill = true;
              if (r.keep) state.keep = true;
              state.count += r.count;
            }
          }
          if (props.children !== undefined) {
            scanNode(props.children, state);
          }
        }

        function removeKilledFromChildren(children) {
          if (Array.isArray(children)) {
            const out = [];
            for (let i = 0; i < children.length; i++) {
              const ch = children[i];
              if (ch && typeof ch === 'object' && ch._killRow && !ch._keepRow) continue;
              if (Array.isArray(ch)) out.push(removeKilledFromChildren(ch));
              else out.push(ch);
            }
            return out;
          }
          if (children && typeof children === 'object' && children._killRow && !children._keepRow) {
            return null;
          }
          return children;
        }

        const wrappedFns = new WeakMap();
        function wrapComponent(fn) {
          if (typeof fn !== 'function' || (fn.prototype && fn.prototype.isReactComponent)) return fn;
          if (wrappedFns.has(fn)) return wrappedFns.get(fn);
          const wrapped = function(props, ref) {
            const res = fn(props, ref);
            if (res && typeof res === 'object' && res._killRow && !res._keepRow) return null;
            return res;
          };
          try { Object.assign(wrapped, fn); } catch (e) {}
          wrappedFns.set(fn, wrapped);
          return wrapped;
        }

        function processElement(el) {
          if (!el || typeof el !== 'object' || !el.props) return el;
          const state = { kill: false, keep: false, count: 0 };
          scanProps(el.props, state);

          try {
            Object.defineProperty(el, '_strCount', { value: state.count, configurable: true });
            Object.defineProperty(el, '_keepRow', { value: state.keep, configurable: true });
          } catch (e) {}

          if (state.kill && !state.keep && state.count <= 6) {
            try {
              Object.defineProperty(el, '_killRow', { value: true, configurable: true });
              const hideStyle = { display: 'none', height: 0, width: 0, margin: 0, marginTop: 0, marginBottom: 0, padding: 0, paddingTop: 0, paddingBottom: 0, borderWidth: 0, borderBottomWidth: 0, opacity: 0, overflow: 'hidden' };
              const nextProps = Object.assign({}, el.props, {
                style: el.props.style ? [el.props.style, hideStyle] : hideStyle
              });
              Object.defineProperty(el, 'props', { value: nextProps, configurable: true });
            } catch (e) {}
            return el;
          }

          if (state.kill && el.props.children !== undefined) {
            try {
              const cleaned = removeKilledFromChildren(el.props.children);
              const nextProps = Object.assign({}, el.props, { children: cleaned });
              Object.defineProperty(el, 'props', { value: nextProps, configurable: true });
            } catch (e) {}
          }
          return el;
        }

        const origCreateElement = React.createElement;
        React.createElement = function(type, props, ...children) {
          const wType = wrapComponent(type);
          const el = origCreateElement.apply(this, [wType, props, ...children]);
          return processElement(el);
        };

        if (jsxRuntime) {
          if (jsxRuntime.jsx) {
            const origJsx = jsxRuntime.jsx;
            jsxRuntime.jsx = function(type, props, key) {
              return processElement(origJsx(wrapComponent(type), props, key));
            };
          }
          if (jsxRuntime.jsxs) {
            const origJsxs = jsxRuntime.jsxs;
            jsxRuntime.jsxs = function(type, props, key) {
              return processElement(origJsxs(wrapComponent(type), props, key));
            };
          }
        }
        `;
        fs.writeFileSync(filterFile, filterCode.trim() + '\n', 'utf8');

        if (fs.existsSync('index.js')) {
          let idxCode = fs.readFileSync('index.js', 'utf8');
          if (!idxCode.includes('tv_lite_filter')) {
            idxCode = `import './src/tv_lite_filter';\n` + idxCode;
            fs.writeFileSync('index.js', idxCode, 'utf8');
          }
        }

        // 9. Aplicar Tema Oficial play.xbox.com (#0e0e0e e #107C10)
        const blueAccents = ['#2088ff','#2088FF','#1890ff','#1890FF','#007aff','#007AFF','#2196f3','#2196F3','#0088ff','#0088FF','#3880ff','#3880FF','#409eff','#409EFF','#0066cc','#0078d4','#0078D4','#6750a4','#6750A4','#00d4ff','#38bdf8'];
        const darkBgs = ['#1a1b2e','#1A1B2E','#161726','#161622','#1e1e2e','#1E1E2E','#181825','#191a2c','#121324','#151625','#1c1d30','#141526','#1b1c2e','#202235','#24273a','#1f2033','#11121e','#0f172a','#1e293b','#172554','#1e3a8a','#0d1b2a','#1b263b','#122342','#0c192c','#132238'];
        walk('src', (p) => {
          if (!/\.(ts|tsx|js|jsx|json)$/.test(p) || p.endsWith('tv_lite_filter.js')) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          blueAccents.forEach((h) => { c = c.split(h).join('#107C10'); });
          darkBgs.forEach((h) => { c = c.split(h).join('#0e0e0e'); });
          c = c.split('"Jump back in"').join('"Voltar ao jogo"').split("'Jump back in'").join("'Voltar ao jogo'");
          c = c.split('"Recently Added"').join('"Adicionados recentemente"').split("'Recently Added'").join("'Adicionados recentemente'");
          c = c.split('"Show all"').join('"Mostrar tudo"').split("'Show all'").join("'Mostrar tudo'");
          c = c.split('"Find games"').join('"Pesquisar jogos"').split("'Find games'").join("'Pesquisar jogos'");
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 10. Garantir suporte de Android TV (LEANBACK_LAUNCHER) e filtro de 1000Hz do controle GameSir
        const manPath = 'android/app/src/main/AndroidManifest.xml';
        if (fs.existsSync(manPath)) {
          let man = fs.readFileSync(manPath, 'utf8');
          if (!man.includes('LEANBACK_LAUNCHER')) {
            man = man.replace(
              '<category android:name="android.intent.category.LAUNCHER" />',
              '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
            );
            fs.writeFileSync(manPath, man, 'utf8');
          }
        }

        const mainAct = 'android/app/src/main/java/com/xstreaming/MainActivity.java';
        if (fs.existsSync(mainAct)) {
          let code = fs.readFileSync(mainAct, 'utf8');
          if (!code.includes('_lastMotionTime') && !code.includes('dispatchGenericMotionEvent')) {
            const filterMethod = `
            private float _lastLX = 0f, _lastLY = 0f, _lastRX = 0f, _lastRY = 0f, _lastLT = 0f, _lastRT = 0f, _lastHatX = 0f, _lastHatY = 0f;
            private long _lastMotionTime = 0L;
            private boolean _wasCentered = true;
            @Override
            public boolean dispatchGenericMotionEvent(android.view.MotionEvent event) {
                if (event != null && (event.getSource() & android.view.InputDevice.SOURCE_JOYSTICK) == android.view.InputDevice.SOURCE_JOYSTICK && event.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                    float lx = event.getAxisValue(android.view.MotionEvent.AXIS_X);
                    float ly = event.getAxisValue(android.view.MotionEvent.AXIS_Y);
                    float rx = event.getAxisValue(android.view.MotionEvent.AXIS_Z);
                    float ry = event.getAxisValue(android.view.MotionEvent.AXIS_RZ);
                    float lt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_LTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_BRAKE));
                    float rt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_RTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_GAS));
                    float hatX = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_X);
                    float hatY = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_Y);
                    boolean isCentered = Math.abs(lx) < 0.08f && Math.abs(ly) < 0.08f && Math.abs(rx) < 0.08f && Math.abs(ry) < 0.08f && lt < 0.05f && rt < 0.05f;
                    boolean hatChanged = Float.compare(hatX, _lastHatX) != 0 || Float.compare(hatY, _lastHatY) != 0;
                    long now = android.os.SystemClock.uptimeMillis();
                    if (!hatChanged) {
                        if (isCentered) {
                            if (_wasCentered) return true;
                            _wasCentered = true;
                        } else {
                            _wasCentered = false;
                            if (now - _lastMotionTime < 14L) return true;
                            if (Math.abs(lx - _lastLX) < 0.015f && Math.abs(ly - _lastLY) < 0.015f && Math.abs(rx - _lastRX) < 0.015f && Math.abs(ry - _lastRY) < 0.015f && Math.abs(lt - _lastLT) < 0.02f && Math.abs(rt - _lastRT) < 0.02f) return true;
                        }
                    }
                    _lastHatX = hatX; _lastHatY = hatY;
                    _lastLX = lx; _lastLY = ly; _lastRX = rx; _lastRY = ry; _lastLT = lt; _lastRT = rt;
                    _lastMotionTime = now;
                }
                return super.dispatchGenericMotionEvent(event);
            }
        }`;
            const lastBrace = code.lastIndexOf('}');
            if (lastBrace !== -1) {
              code = code.slice(0, lastBrace) + filterMethod + '\n';
              fs.writeFileSync(mainAct, code, 'utf8');
            }
          }
        }
        EOF

    - name: Configure Signing, Strip x86 Libraries and Disable Nano/C++ Tasks
      run: |
        cat << 'EOF' > /tmp/init.gradle
        allprojects {
            tasks.configureEach { task ->
                if (task.name.contains("NanoRust") || task.name.contains("DevRelease") || task.name.contains("DevDebug") || task.name.contains("externalNativeBuild") || task.name.contains("configureCMake") || task.name.contains("buildCMake")) {
                    task.enabled = false
                }
            }
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        buildTypes {
                            release {
                                signingConfig signingConfigs.debug
                            }
                        }
                        packagingOptions {
                            exclude 'lib/x86/**'
                            exclude 'lib/x86_64/**'
                            exclude '**/liblsfg*.so'
                            exclude '**/libframegen*.so'
                            exclude '**/libnano*.so'
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleProdRelease -x lint -x test -x syncNanoRustJniLibs --init-script /tmp/init.gradle

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XStreaming-TV-UltraLite-APK
        path: android/app/build/outputs/apk/**/*.apk
