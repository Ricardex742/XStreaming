name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Limpar base Android e React Native
      run: |
        git remote add upstream https://github.com/Geocld/XStreaming.git || true
        git fetch upstream main
        git checkout upstream/main -- android/ package.json yarn.lock src/
        echo "" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
        sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/g' android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Rust & Android NDK 23.1.7779620
      run: |
        rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"
        if [ -d "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64" ]; then
          ln -sf "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64" "$ANDROID_HOME/ndk/23.1.7779620/toolchains/llvm/prebuilt/darwin-x86_64" || true
        fi

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Exclusao Fisica de Arquivos Inuteis, Tema Xbox e Atalhos na TV
      shell: python
      run: |
        import os, re, shutil, base64

        # 1. DELETAR FISICAMENTE todas as pastas de binarios x86 e x86_64 (Economiza ~45MB reais no APK)
        for search_root in ["android", "node_modules"]:
            if os.path.exists(search_root):
                for root, dirs, _ in os.walk(search_root, topdown=False):
                    for d in dirs:
                        if d in ("x86", "x86_64"):
                            full_d = os.path.join(root, d)
                            try:
                                shutil.rmtree(full_d)
                            except Exception:
                                pass

        # 2. DELETAR FISICAMENTE arquivos legados de WebView em assets/stream
        stream_assets = "android/app/src/main/assets/stream/assets"
        if os.path.exists(stream_assets):
            for root, _, files in os.walk(stream_assets):
                for file in files:
                    if "legacy" in file and file.endswith(".js"):
                        try:
                            os.remove(os.path.join(root, file))
                        except Exception:
                            pass

        # 3. Deletar classes auxiliares orfas e esvaziar FSR, FrameGen, TouchControls e Sensores
        java_root = "android/app/src/main/java"
        all_java_files = {}
        for root, _, files in os.walk(java_root):
            for file in files:
                if file.endswith(".java"):
                    p = os.path.join(root, file)
                    with open(p, "r", encoding="utf-8") as f:
                        all_java_files[p] = f.read()

        for target_sub in ["fsr", "framegen", "touchcontrols", "sensor"]:
            sub_dir = os.path.join(java_root, "com/xstreaming", target_sub)
            if os.path.exists(sub_dir):
                for root, _, files in os.walk(sub_dir):
                    for file in files:
                        if not file.endswith(".java"):
                            try:
                                os.remove(os.path.join(root, file))
                            except Exception:
                                pass
                            continue
                        cls_name = file[:-5]
                        p = os.path.join(root, file)
                        referenced_outside = False
                        for other_p, other_code in all_java_files.items():
                            if other_p != p and re.search(r'\b' + re.escape(cls_name) + r'\b', other_code):
                                referenced_outside = True
                                break
                        if not referenced_outside:
                            try:
                                os.remove(p)
                                del all_java_files[p]
                            except Exception:
                                pass

        # Esvaziar o corpo pesado dos arquivos restantes de TouchControls, FSR e FrameGen
        tc_dir = "android/app/src/main/java/com/xstreaming/touchcontrols"
        if os.path.exists(tc_dir):
            for root, _, files in os.walk(tc_dir):
                for file in files:
                    if file.endswith(".java"):
                        p = os.path.join(root, file)
                        with open(p, "r", encoding="utf-8") as f:
                            c = f.read()
                        c = re.sub(r'(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)', r'\1 setVisibility(android.view.View.GONE); if (true) return;', c)
                        c = re.sub(r'(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)', r'\1 if (true) return false;', c)
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(c)

        for sub in ["fsr", "framegen"]:
            d = os.path.join("android/app/src/main/java/com/xstreaming", sub)
            if os.path.exists(d):
                for root, _, files in os.walk(d):
                    for file in files:
                        if file.endswith(".java"):
                            p = os.path.join(root, file)
                            with open(p, "r", encoding="utf-8") as f:
                                c = f.read()
                            c = re.sub(r'(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)', r'\1 \2 = false;', c)
                            with open(p, "w", encoding="utf-8") as f:
                                f.write(c)

        # 4. Reequilibrar decodificador MediaCodec para TV TCL
        for root, _, files in os.walk(java_root):
            for file in files:
                if file.endswith(".java"):
                    p = os.path.join(root, file)
                    with open(p, "r", encoding="utf-8") as f:
                        c = f.read()
                    orig = c
                    c = c.replace("MediaFormat.KEY_PRIORITY, 0", "MediaFormat.KEY_PRIORITY, 1")
                    c = c.replace("KEY_OPERATING_RATE, Short.MAX_VALUE", "KEY_OPERATING_RATE, 60")
                    c = c.replace("KEY_OPERATING_RATE, Integer.MAX_VALUE", "KEY_OPERATING_RATE, 60")
                    if c != orig:
                        with open(p, "w", encoding="utf-8") as f:
                            f.write(c)

        # 5. Substituir PNGs gigantes de Splash e Marcas d'Agua por pixel de 68 bytes
        tiny_png = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=")
        for search_folder in ["android/app/src/main/res", "src"]:
            if os.path.exists(search_folder):
                for root, _, files in os.walk(search_folder):
                    for file in files:
                        low = file.lower()
                        if low in ("screen.png", "screen_land.png", "bg.png", "background.png", "bg.jpg", "gamepad_bg.png"):
                            with open(os.path.join(root, file), "wb") as f:
                                f.write(tiny_png)

        # 6. Tema Oficial play.xbox.com (#0e0e0e e #107C10) e ocultacao de menus inuteis
        blue_accents = [
            "#2088ff", "#2088FF", "#1890ff", "#1890FF", "#007aff", "#007AFF",
            "#2196f3", "#2196F3", "#0088ff", "#0088FF", "#3880ff", "#3880FF",
            "#409eff", "#409EFF", "#0066cc", "#0078d4", "#0078D4", "#6750a4", "#6750A4"
        ]
        dark_blue_bgs = [
            "#1a1b2e", "#1A1B2E", "#161726", "#161622", "#1e1e2e", "#1E1E2E",
            "#181825", "#191a2c", "#121324", "#151625", "#1c1d30", "#141526",
            "#1b1c2e", "#202235", "#24273a", "#1f2033", "#11121e"
        ]
        if os.path.exists("src"):
            for root, _, files in os.walk("src"):
                for file in files:
                    if file.endswith((".ts", ".tsx", ".js", ".jsx", ".json")):
                        p = os.path.join(root, file)
                        try:
                            with open(p, "r", encoding="utf-8") as f:
                                c = f.read()
                            orig = c
                            for b_hex in blue_accents:
                                c = c.replace(b_hex, "#107C10")
                            for bg_hex in dark_blue_bgs:
                                c = c.replace(bg_hex, "#0e0e0e")
                            c = c.replace('"Jump back in"', '"Voltar ao jogo"').replace("'Jump back in'", "'Voltar ao jogo'")
                            c = c.replace('"Recently Added"', '"Adicionados recentemente"').replace("'Recently Added'", "'Adicionados recentemente'")
                            c = c.replace('"Show all"', '"Mostrar tudo"').replace("'Show all'", "'Mostrar tudo'")
                            c = c.replace('"Find games"', '"Pesquisar jogos"').replace("'Find games'", "'Pesquisar jogos'")
                            if c != orig:
                                with open(p, "w", encoding="utf-8") as f:
                                    f.write(c)
                        except Exception:
                            pass

        # 7. Remover arquiteturas x86 / x86_64 do build.gradle para nao empacotar no APK
        bg_path = "android/app/build.gradle"
        if os.path.exists(bg_path):
            with open(bg_path, "r", encoding="utf-8") as f:
                bg = f.read()
            bg = bg.replace('"x86", "x86_64", ', '').replace(', "x86", "x86_64"', '')
            bg = bg.replace('"x86", ', '').replace(', "x86"', '').replace('"x86_64", ', '').replace(', "x86_64"', '')
            bg = bg.replace("'x86', 'x86_64', ", "").replace(", 'x86', 'x86_64'", "")
            bg = bg.replace("'x86', ", "").replace(", 'x86'", "").replace("'x86_64', ", "").replace(", 'x86_64'", "")
            with open(bg_path, "w", encoding="utf-8") as f:
                f.write(bg)

        # 8. Habilitar Suporte a Atalhos na Tela Inicial da Android TV no AndroidManifest.xml
        manifest_path = "android/app/src/main/AndroidManifest.xml"
        if os.path.exists(manifest_path):
            with open(manifest_path, "r", encoding="utf-8") as f:
                man = f.read()
            if "INSTALL_SHORTCUT" not in man:
                man = man.replace("<application", '<uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />\n    <uses-permission android:name="com.android.providers.tv.permission.WRITE_EPG_DATA" />\n    <application', 1)
            if "LEANBACK_LAUNCHER" not in man:
                man = man.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />')
            with open(manifest_path, "w", encoding="utf-8") as f:
                f.write(man)

        # 9. Filtro de 1000Hz do Dongle GameSir + Criador de Atalhos na TV (Apertar L3 + R3 juntos)
        main_act = "android/app/src/main/java/com/xstreaming/MainActivity.java"
        if os.path.exists(main_act):
            with open(main_act, "r", encoding="utf-8") as f:
                code = f.read()
            if "_lastMotionTime" not in code and "dispatchGenericMotionEvent" not in code:
                lines = [
                    "    private float _lastLX = 0f, _lastLY = 0f, _lastRX = 0f, _lastRY = 0f, _lastLT = 0f, _lastRT = 0f, _lastHatX = 0f, _lastHatY = 0f;",
                    "    private long _lastMotionTime = 0L;",
                    "    private boolean _wasCentered = true;",
                    "    private boolean _l3Pressed = false, _r3Pressed = false;",
                    "    private void createTvHomeShortcut() {",
                    "        if (android.os.Build.VERSION.SDK_INT >= 26) {",
                    "            try {",
                    "                android.content.pm.ShortcutManager sm = getSystemService(android.content.pm.ShortcutManager.class);",
                    "                if (sm != null) {",
                    "                    android.content.Intent launchIntent = new android.content.Intent(this, MainActivity.class);",
                    "                    launchIntent.setAction(android.content.Intent.ACTION_VIEW);",
                    "                    launchIntent.putExtra(\"direct_cloud\", true);",
                    "                    String id = \"xcloud_quick_\" + (System.currentTimeMillis() / 60000);",
                    "                    android.content.pm.ShortcutInfo info = new android.content.pm.ShortcutInfo.Builder(this, id)",
                    "                        .setShortLabel(\"Xbox Cloud\")",
                    "                        .setLongLabel(\"Jogar no Xbox Cloud Gaming\")",
                    "                        .setIcon(android.graphics.drawable.Icon.createWithResource(this, getApplicationInfo().icon))",
                    "                        .setIntent(launchIntent)",
                    "                        .build();",
                    "                    sm. addDynamicShortcuts(java.util.Collections.singletonList(info));",
                    "                    if (sm.isRequestPinShortcutSupported()) {",
                    "                        sm.requestPinShortcut(info, null);",
                    "                    }",
                    "                    android.widget.Toast.makeText(this, \"Atalho enviado para a Tela Inicial da TV!\", android.widget.Toast.LENGTH_SHORT).show();",
                    "                }",
                    "            } catch (Exception ignored) {}",
                    "        }",
                    "    }",
                    "    @Override",
                    "    public boolean dispatchKeyEvent(android.view.KeyEvent event) {",
                    "        if (event != null) {",
                    "            int code = event.getKeyCode();",
                    "            boolean down = event.getAction() == android.view.KeyEvent.ACTION_DOWN;",
                    "            if (code == android.view.KeyEvent.KEYCODE_BUTTON_THUMBL) _l3Pressed = down;",
                    "            if (code == android.view.KeyEvent.KEYCODE_BUTTON_THUMBR) _r3Pressed = down;",
                    "            if (_l3Pressed && _r3Pressed && down) {",
                    "                _l3Pressed = false; _r3Pressed = false;",
                    "                createTvHomeShortcut();",
                    "                return true;",
                    "            }",
                    "        }",
                    "        return super.dispatchKeyEvent(event);",
                    "    }",
                    "    @Override",
                    "    public boolean dispatchGenericMotionEvent(android.view.MotionEvent event) {",
                    "        if (event != null && (event.getSource() & android.view.InputDevice.SOURCE_JOYSTICK) == android.view.InputDevice.SOURCE_JOYSTICK && event.getAction() == android.view.MotionEvent.ACTION_MOVE) {",
                    "            float lx = event.getAxisValue(android.view.MotionEvent.AXIS_X);",
                    "            float ly = event.getAxisValue(android.view.MotionEvent.AXIS_Y);",
                    "            float rx = event.getAxisValue(android.view.MotionEvent.AXIS_Z);",
                    "            float ry = event.getAxisValue(android.view.MotionEvent.AXIS_RZ);",
                    "            float lt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_LTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_BRAKE));",
                    "            float rt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_RTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_GAS));",
                    "            float hatX = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_X);",
                    "            float hatY = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_Y);",
                    "            boolean isCentered = Math.abs(lx) < 0.08f && Math.abs(ly) < 0.08f && Math.abs(rx) < 0.08f && Math.abs(ry) < 0.08f && lt < 0.05f && rt < 0.05f;",
                    "            boolean hatChanged = Float.compare(hatX, _lastHatX) != 0 || Float.compare(hatY, _lastHatY) != 0;",
                    "            long now = android.os.SystemClock.uptimeMillis();",
                    "            if (!hatChanged) {",
                    "                if (isCentered) {",
                    "                    if (_wasCentered) return true;",
                    "                    _wasCentered = true;",
                    "                } else {",
                    "                    _wasCentered = false;",
                    "                    if (now - _lastMotionTime < 14L) return true;",
                    "                    if (Math.abs(lx - _lastLX) < 0.015f && Math.abs(ly - _lastLY) < 0.015f && Math.abs(rx - _lastRX) < 0.015f && Math.abs(ry - _lastRY) < 0.015f && Math.abs(lt - _lastLT) < 0.02f && Math.abs(rt - _lastRT) < 0.02f) return true;",
                    "                }",
                    "            }",
                    "            _lastHatX = hatX; _lastHatY = hatY;",
                    "            _lastLX = lx; _lastLY = ly; _lastRX = rx; _lastRY = ry; _lastLT = lt; _lastRT = rt;",
                    "            _lastMotionTime = now;",
                    "        }",
                    "        return super.dispatchGenericMotionEvent(event);",
                    "    }"
                ]
                last_brace = code.rfind("}")
                if last_brace != -1:
                    code = code[:last_brace] + "\n" + "\n".join(lines) + "\n}\n"
                    with open(main_act, "w", encoding="utf-8") as f:
                        f.write(code)

    - name: Configure Signing & Strip Unused Native Libraries
      run: |
        cat << 'EOF' > /tmp/init.gradle
        allprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        buildTypes {
                            release {
                                signingConfig signingConfigs.debug
                            }
                        }
                        packagingOptions {
                            exclude 'lib/x86/**'
                            exclude 'lib/x86_64/**'
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleProdRelease -x lint -x test --init-script /tmp/init.gradle || ./gradlew assembleRelease -x lint -x test --init-script /tmp/init.gradle

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XStreaming-TV-UltraLite-APK
        path: android/app/build/outputs/apk/**/*.apk
