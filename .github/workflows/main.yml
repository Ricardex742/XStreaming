name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Limpar base Android e React Native
      run: |
        git remote add upstream https://github.com/Geocld/XStreaming.git || true
        git fetch upstream main
        git checkout upstream/main -- android/ package.json yarn.lock src/ index.js
        git clean -fd android/ src/
        echo "" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
        sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/g' android/gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Android NDK 23.1.7779620
      run: |
        set +e
        set +o pipefail
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1"
        exit 0

    - name: Install Dependencies
      run: |
        echo "nodeLinker: node-modules" > .yarnrc.yml
        node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (pkg.scripts) delete pkg.scripts.postinstall; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
        corepack enable
        yarn install
        if [ -d "patches" ]; then
          for f in patches/*.patch; do
            [ -f "$f" ] && patch -p1 -N < "$f" || true
          done
        fi

    - name: Pular Tela Consoles, Remover Opcoes Circuladas e Aplicar Tema Xbox
      run: |
        node << 'EOF'
        const fs = require('fs');
        const path = require('path');

        function walk(dir, cb) {
          if (!fs.existsSync(dir)) return;
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) walk(p, cb);
            else cb(p);
          }
        }

        // 1. Esvaziar scripts legados pesados e reduzir PNGs de fundo para 68 bytes
        walk('android/app/src/main/assets/stream/assets', (p) => {
          if (p.includes('legacy') && p.endsWith('.js')) {
            fs.writeFileSync(p, '', 'utf8');
          }
        });

        const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
        ['android/app/src/main/res', 'src'].forEach((folder) => {
          walk(folder, (p) => {
            const low = path.basename(p).toLowerCase();
            if (['screen.png', 'screen_land.png', 'bg.png', 'background.png', 'bg.jpg', 'gamepad_bg.png'].includes(low)) {
              fs.writeFileSync(p, tinyPng);
            }
          });
        });

        // 2. Desativar classes Java de Controle Virtual, FSR, FrameGen, Giroscopio e PiP
        walk('android/app/src/main/java/com/xstreaming/touchcontrols', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          c = c.replace(/(protected\s+void\s+onDraw\s*\([^)]*\)\s*\{)/g, '$1 setVisibility(android.view.View.GONE); if (true) return;');
          c = c.replace(/(public\s+boolean\s+onTouchEvent\s*\([^)]*\)\s*\{)/g, '$1 if (true) return false;');
          fs.writeFileSync(p, c, 'utf8');
        });

        ['fsr', 'framegen', 'sensor', 'pip', 'dualsense', 'proxy'].forEach((sub) => {
          walk(path.join('android/app/src/main/java/com/xstreaming', sub), (p) => {
            if (!p.endsWith('.java')) return;
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(/(public\s+void\s+set(?:Fsr|FrameGen)?Enabled\s*\(\s*boolean\s+(\w+)\s*\)\s*\{)/g, '$1 $2 = false;');
            c = c.replace(/(public\s+void\s+onSensorChanged\s*\([^)]*\)\s*\{)/g, '$1 if (true) return;');
            fs.writeFileSync(p, c, 'utf8');
          });
        });

        // 3. Proteger System.loadLibrary contra ausencia do NanoRust e reequilibrar MediaCodec
        walk('android/app/src/main/java', (p) => {
          if (!p.endsWith('.java')) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          c = c.replace(/MediaFormat\.KEY_PRIORITY,\s*0/g, 'MediaFormat.KEY_PRIORITY, 1');
          c = c.replace(/KEY_OPERATING_RATE,\s*Short\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          c = c.replace(/KEY_OPERATING_RATE,\s*Integer\.MAX_VALUE/g, 'KEY_OPERATING_RATE, 60');
          c = c.replace(/System\.loadLibrary\s*\(\s*("[^"]+")\s*\)\s*;/g, 'try { System.loadLibrary($1); } catch (Throwable ignored) {}');
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 4. Remover x86 / x86_64 do build.gradle
        const bgPath = 'android/app/build.gradle';
        if (fs.existsSync(bgPath)) {
          let bg = fs.readFileSync(bgPath, 'utf8');
          bg = bg.replace(/"x86",\s*"x86_64",\s*/g, '').replace(/'x86',\s*'x86_64',\s*/g, '');
          bg = bg.replace(/,\s*"x86",\s*"x86_64"/g, '').replace(/,\s*'x86',\s*'x86_64'/g, '');
          fs.writeFileSync(bgPath, bg, 'utf8');
        }

        // 5. Filtro React Native: Pula a tela "Consoles / Mais" direto para "xCloud" e remove opcoes circuladas
        const filterFile = 'src/tv_lite_filter.js';
        const filterCode = `
        try {
          const React = require('react');
          const jsxRuntime = require('react/jsx-runtime');

          const killedSet = new WeakSet();
          const keptSet = new WeakSet();
          const xcloudSet = new WeakSet();
          const consoleScreenSet = new WeakSet();
          const countMap = new WeakMap();
          let lastXcloudTrigger = 0;

          function norm(str) {
            if (typeof str !== 'string') return '';
            return str.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim().toLowerCase();
          }

          const EXACT_KILL = new Set([
            'dualsense',
            'servidor intermediario',
            'outros',
            'sensor',
            'streaming do console',
            'controle virtual',
            'fsr',
            'formato do video',
            'picture-in-picture',
            'nano (experimental)',
            'webview'
          ]);

          const SUBSTR_KILL = [
            'configurar gatilho esquerdo',
            'escolha como o gatilho esquerdo',
            'configurar gatilho direito',
            'escolha como o gatilho direito',
            'servidor intermediario integrado',
            'usa um servidor integrado ao xstreaming',
            'servidor intermediario personalizado',
            'toque nativo (experimental)',
            'ativar o toque nativo',
            'ativar giroscopio',
            'usar o giroscopio do dispositivo',
            'como ativar o giroscopio',
            'escolha se o giroscopio sera ativado',
            'sensibilidade do eixo x do giroscopio',
            'ajustar a sensibilidade do movimento horizontal',
            'sensibilidade do eixo y do giroscopio',
            'ajustar a sensibilidade do movimento vertical',
            'inverter movimento do giroscopio',
            'movimento do giroscopio pode ficar invertido',
            'ligar ao iniciar o streaming',
            'escolha se deseja ligar o console',
            'servidor de conexao(xhome)',
            'este servidor ajuda a estabelecer a conexao',
            'sempre mostrar o controle virtual',
            'transparencia dos botoes virtuais',
            'configurar a transparencia do controle virtual',
            'layout do analogico virtual',
            'escolher se o analogico virtual ficara fixo',
            'personalizar botoes virtuais',
            'personalize o layout do seu controle virtual',
            'manter botoes automaticamente',
            'escolha quais botoes poderao ser mantidos',
            'configuracoes do botao macro virtual',
            'ativar o botao macro e editar sua sequencia',
            'ative o fsr',
            'fidelityfx super resolution',
            'geracao inteligente de quadros',
            'apos importar o lossless.dll',
            'importar lossless.dll',
            'prepare um arquivo de origem legal',
            'selecione como o video sera exibido',
            'colocar o streaming em segundo plano abrira o modo picture-in-picture'
          ];

          const CONSOLE_SCREEN_EXACT = new Set([
            'consoles',
            'mais',
            'conquistas',
            'atualizar'
          ]);

          const CONSOLE_SCREEN_SUBSTR = [
            'nenhum console foi encontrado nesta conta',
            'verifique se o remote play esta ativado'
          ];

          const PROTECTED_SUBSTR = [
            'definir resolucao',
            'priorizar conexao ipv6',
            'native: usa o sistema nativo',
            'motor de processamento',
            'teste os botoes',
            'salvar',
            'voltar',
            'iniciar jogo',
            'voltar ao jogo',
            'pesquisar jogos',
            'jogos disponiveis',
            'jogar com game pass'
          ];

          function checkText(raw) {
            const s = norm(raw);
            if (!s) return { kill: false, keep: false, isXcloud: false, isConsoleUI: false, count: 0 };
            if (s === 'xcloud') {
              return { kill: false, keep: true, isXcloud: true, isConsoleUI: true, count: 1 };
            }
            if (CONSOLE_SCREEN_EXACT.has(s)) {
              return { kill: false, keep: false, isXcloud: false, isConsoleUI: true, count: 1 };
            }
            for (let i = 0; i < CONSOLE_SCREEN_SUBSTR.length; i++) {
              if (s.includes(CONSOLE_SCREEN_SUBSTR[i])) {
                return { kill: false, keep: false, isXcloud: false, isConsoleUI: true, count: 1 };
              }
            }
            if (s === 'native' || s === 'configuracoes' || s === 'resolucao' || s === 'ipv6' || s === 'audio') {
              return { kill: false, keep: true, isXcloud: false, isConsoleUI: false, count: 1 };
            }
            for (let i = 0; i < PROTECTED_SUBSTR.length; i++) {
              if (s.includes(PROTECTED_SUBSTR[i])) return { kill: false, keep: true, isXcloud: false, isConsoleUI: false, count: 1 };
            }
            if (EXACT_KILL.has(s)) return { kill: true, keep: false, isXcloud: false, isConsoleUI: false, count: 1 };
            for (let i = 0; i < SUBSTR_KILL.length; i++) {
              if (s.includes(SUBSTR_KILL[i])) return { kill: true, keep: false, isXcloud: false, isConsoleUI: false, count: 1 };
            }
            return { kill: false, keep: false, isXcloud: false, isConsoleUI: false, count: s.length > 1 ? 1 : 0 };
          }

          function scanNode(node, state) {
            if (node == null || typeof node === 'boolean' || typeof node === 'number') return;
            if (typeof node === 'string') {
              const r = checkText(node);
              if (r.kill) state.kill = true;
              if (r.keep) state.keep = true;
              if (r.isXcloud) state.isXcloud = true;
              if (r.isConsoleUI) state.isConsoleUI = true;
              state.count += r.count;
              return;
            }
            if (Array.isArray(node)) {
              for (let i = 0; i < node.length; i++) scanNode(node[i], state);
              return;
            }
            if (typeof node === 'object') {
              if (killedSet.has(node)) state.kill = true;
              if (keptSet.has(node)) state.keep = true;
              if (xcloudSet.has(node)) state.isXcloud = true;
              if (consoleScreenSet.has(node)) state.isConsoleUI = true;
              if (countMap.has(node)) {
                state.count += countMap.get(node);
              } else if (node.props) {
                scanProps(node.props, state);
              }
            }
          }

          function scanProps(props, state) {
            if (!props) return;
            const keys = ['title', 'label', 'name', 'description', 'subTitle', 'subtitle', 'header', 'text'];
            for (let i = 0; i < keys.length; i++) {
              if (typeof props[keys[i]] === 'string') {
                const r = checkText(props[keys[i]]);
                if (r.kill) state.kill = true;
                if (r.keep) state.keep = true;
                if (r.isXcloud) state.isXcloud = true;
                if (r.isConsoleUI) state.isConsoleUI = true;
                state.count += r.count;
              }
            }
            if (props.children !== undefined) {
              scanNode(props.children, state);
            }
          }

          const HIDE_STYLE = {
            display: 'none',
            height: 0,
            width: 0,
            margin: 0,
            marginTop: 0,
            marginBottom: 0,
            padding: 0,
            paddingTop: 0,
            paddingBottom: 0,
            borderWidth: 0,
            borderBottomWidth: 0,
            opacity: 0,
            overflow: 'hidden'
          };

          const INVISIBLE_CONSOLE_STYLE = {
            opacity: 0
          };

          function evaluateAndStyle(type, props, childrenArgs) {
            if (!props || type === React.Fragment) {
              return { props, markKill: false, markKeep: false, markXcloud: false, markConsoleUI: false, count: 0 };
            }
            if (props.navigation || props.route || props.component || props.initialRouteName || props.screens) {
              return { props, markKill: false, markKeep: true, markXcloud: false, markConsoleUI: false, count: 10 };
            }
            const state = { kill: false, keep: false, isXcloud: false, isConsoleUI: false, count: 0 };
            scanProps(props, state);
            if (childrenArgs && childrenArgs.length > 0) {
              scanNode(childrenArgs, state);
            }

            // Se encontrou o card clicavel "xCloud" da primeira tela, dispara a entrada automatica para a tela de jogos
            if (state.isXcloud) {
              const pressFn = props.onPress || props.onClick || props.onResponderRelease;
              if (typeof pressFn === 'function') {
                const now = Date.now();
                if (now - lastXcloudTrigger > 800) {
                  lastXcloudTrigger = now;
                  setTimeout(function() {
                    try { pressFn(); } catch (e) {}
                  }, 25);
                  setTimeout(function() {
                    try { pressFn(); } catch (e) {}
                  }, 220);
                }
              }
            }

            // Oculta visualmente os blocos da primeira tela (Consoles / Mais) enquanto redireciona para o xCloud
            if (state.isConsoleUI && state.count <= 6) {
              const nextProps = Object.assign({}, props, {
                style: props.style ? [props.style, INVISIBLE_CONSOLE_STYLE] : INVISIBLE_CONSOLE_STYLE
              });
              return { props: nextProps, markKill: false, markKeep: state.keep, markXcloud: state.isXcloud, markConsoleUI: true, count: state.count };
            }

            if (state.kill && !state.keep && state.count <= 4) {
              const nextProps = Object.assign({}, props, {
                style: props.style ? [props.style, HIDE_STYLE] : HIDE_STYLE,
                focusable: false,
                accessible: false,
                pointerEvents: 'none'
              });
              return { props: nextProps, markKill: true, markKeep: false, markXcloud: false, markConsoleUI: false, count: state.count };
            }
            return { props, markKill: false, markKeep: state.keep, markXcloud: state.isXcloud, markConsoleUI: state.isConsoleUI, count: state.count };
          }

          function tagElement(el, info) {
            if (el && typeof el === 'object') {
              try {
                countMap.set(el, info.count);
                if (info.markKill) killedSet.add(el);
                if (info.markKeep) keptSet.add(el);
                if (info.markXcloud) xcloudSet.add(el);
                if (info.markConsoleUI) consoleScreenSet.add(el);
              } catch (e) {}
            }
            return el;
          }

          const origCreateElement = React.createElement;
          React.createElement = function(type, props, ...children) {
            try {
              const info = evaluateAndStyle(type, props, children);
              const el = origCreateElement.apply(this, [type, info.props, ...children]);
              return tagElement(el, info);
            } catch (e) {
              return origCreateElement.apply(this, arguments);
            }
          };

          if (jsxRuntime) {
            if (jsxRuntime.jsx) {
              const origJsx = jsxRuntime.jsx;
              jsxRuntime.jsx = function(type, props, key) {
                try {
                  const info = evaluateAndStyle(type, props, null);
                  return tagElement(origJsx(type, info.props, key), info);
                } catch (e) {
                  return origJsx(type, props, key);
                }
              };
            }
            if (jsxRuntime.jsxs) {
              const origJsxs = jsxRuntime.jsxs;
              jsxRuntime.jsxs = function(type, props, key) {
                try {
                  const info = evaluateAndStyle(type, props, null);
                  return tagElement(origJsxs(type, info.props, key), info);
                } catch (e) {
                  return origJsxs(type, props, key);
                }
              };
            }
          }
        } catch (e) {}
        `;
        fs.writeFileSync(filterFile, filterCode.trim() + '\n', 'utf8');

        if (fs.existsSync('index.js')) {
          let idxCode = fs.readFileSync('index.js', 'utf8');
          if (!idxCode.includes('tv_lite_filter')) {
            idxCode = `import './src/tv_lite_filter';\n` + idxCode;
            fs.writeFileSync('index.js', idxCode, 'utf8');
          }
        }

        // 6. Aplicar Tema Oficial play.xbox.com (#0e0e0e e #107C10)
        const blueAccents = ['#2088ff','#2088FF','#1890ff','#1890FF','#007aff','#007AFF','#2196f3','#2196F3','#0088ff','#0088FF','#3880ff','#3880FF','#409eff','#409EFF','#0066cc','#0078d4','#0078D4','#6750a4','#6750A4','#00d4ff','#38bdf8'];
        const darkBgs = ['#1a1b2e','#1A1B2E','#161726','#161622','#1e1e2e','#1E1E2E','#181825','#191a2c','#121324','#151625','#1c1d30','#141526','#1b1c2e','#202235','#24273a','#1f2033','#11121e','#0f172a','#1e293b','#172554','#1e3a8a','#0d1b2a','#1b263b','#122342','#0c192c','#132238'];
        walk('src', (p) => {
          if (!/\.(ts|tsx|js|jsx|json)$/.test(p) || p.endsWith('tv_lite_filter.js')) return;
          let c = fs.readFileSync(p, 'utf8');
          const orig = c;
          blueAccents.forEach((h) => { c = c.split(h).join('#107C10'); });
          darkBgs.forEach((h) => { c = c.split(h).join('#0e0e0e'); });
          c = c.split('"Jump back in"').join('"Voltar ao jogo"').split("'Jump back in'").join("'Voltar ao jogo'");
          c = c.split('"Recently Added"').join('"Adicionados recentemente"').split("'Recently Added'").join("'Adicionados recentemente'");
          c = c.split('"Show all"').join('"Mostrar tudo"').split("'Show all'").join("'Mostrar tudo'");
          c = c.split('"Find games"').join('"Pesquisar jogos"').split("'Find games'").join("'Pesquisar jogos'");
          if (c !== orig) fs.writeFileSync(p, c, 'utf8');
        });

        // 7. Garantir extractNativeLibs="true" e LEANBACK_LAUNCHER no AndroidManifest.xml
        const manPath = 'android/app/src/main/AndroidManifest.xml';
        if (fs.existsSync(manPath)) {
          let man = fs.readFileSync(manPath, 'utf8');
          if (!man.includes('LEANBACK_LAUNCHER')) {
            man = man.replace(
              '<category android:name="android.intent.category.LAUNCHER" />',
              '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
            );
          }
          if (man.includes('android:extractNativeLibs="false"')) {
            man = man.replace('android:extractNativeLibs="false"', 'android:extractNativeLibs="true"');
          } else if (!man.includes('android:extractNativeLibs')) {
            man = man.replace('<application', '<application android:extractNativeLibs="true"');
          }
          fs.writeFileSync(manPath, man, 'utf8');
        }

        // 8. Injetar Fallback Nativo de Auto-Entrada no xCloud + Filtro 1000Hz GameSir na MainActivity.java
        const mainAct = 'android/app/src/main/java/com/xstreaming/MainActivity.java';
        if (fs.existsSync(mainAct)) {
          let code = fs.readFileSync(mainAct, 'utf8');
          code = code.replace(/(super\.onCreate\s*\([^)]*\)\s*;)/, '$1 startDirectXcloudWatcher();');
          if (!code.includes('startDirectXcloudWatcher')) {
            const extraMethods = `
            private boolean _watcherStarted = false;
            private long _lastXcloudTap = 0L;
            private void startDirectXcloudWatcher() {
                if (_watcherStarted) return;
                _watcherStarted = true;
                final android.os.Handler h = new android.os.Handler(android.os.Looper.getMainLooper());
                h.postDelayed(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            if (getWindow() != null && getWindow().getDecorView() != null) {
                                android.view.View root = getWindow().getDecorView();
                                java.util.List<android.widget.TextView> tvs = new java.util.ArrayList<>();
                                collectTextViews(root, tvs);
                                android.widget.TextView xcloudTv = null;
                                boolean onConsoleScreen = false;
                                for (android.widget.TextView tv : tvs) {
                                    String t = tv.getText() != null ? tv.getText().toString().trim() : "";
                                    if (t.equalsIgnoreCase("xCloud")) xcloudTv = tv;
                                    if (t.equalsIgnoreCase("Consoles") || t.equalsIgnoreCase("Conquistas") || t.contains("Nenhum console")) onConsoleScreen = true;
                                }
                                long now = android.os.SystemClock.uptimeMillis();
                                if (xcloudTv != null && onConsoleScreen && (now - _lastXcloudTap > 900L)) {
                                    _lastXcloudTap = now;
                                    int[] loc = new int[2];
                                    xcloudTv.getLocationOnScreen(loc);
                                    int[] rLoc = new int[2];
                                    root.getLocationOnScreen(rLoc);
                                    float x = (loc[0] - rLoc[0]) + (xcloudTv.getWidth() / 2.0f);
                                    float y = (loc[1] - rLoc[1]) - 20.0f;
                                    if (y < 10f) y = (loc[1] - rLoc[1]) + (xcloudTv.getHeight() / 2.0f);
                                    root.dispatchTouchEvent(android.view.MotionEvent.obtain(now, now, android.view.MotionEvent.ACTION_DOWN, x, y, 0));
                                    root.dispatchTouchEvent(android.view.MotionEvent.obtain(now, now + 40, android.view.MotionEvent.ACTION_UP, x, y, 0));
                                }
                            }
                        } catch (Throwable ignored) {}
                        h.postDelayed(this, 250);
                    }
                }, 150);
            }
            private void collectTextViews(android.view.View v, java.util.List<android.widget.TextView> out) {
                if (v == null || v.getVisibility() != android.view.View.VISIBLE) return;
                if (v instanceof android.widget.TextView) out.add((android.widget.TextView) v);
                else if (v instanceof android.view.ViewGroup) {
                    android.view.ViewGroup vg = (android.view.ViewGroup) v;
                    for (int i = 0; i < vg.getChildCount(); i++) collectTextViews(vg.getChildAt(i), out);
                }
            }
            private float _lastLX = 0f, _lastLY = 0f, _lastRX = 0f, _lastRY = 0f, _lastLT = 0f, _lastRT = 0f, _lastHatX = 0f, _lastHatY = 0f;
            private long _lastMotionTime = 0L;
            private boolean _wasCentered = true;
            @Override
            public boolean dispatchGenericMotionEvent(android.view.MotionEvent event) {
                if (event != null && (event.getSource() & android.view.InputDevice.SOURCE_JOYSTICK) == android.view.InputDevice.SOURCE_JOYSTICK && event.getAction() == android.view.MotionEvent.ACTION_MOVE) {
                    float lx = event.getAxisValue(android.view.MotionEvent.AXIS_X);
                    float ly = event.getAxisValue(android.view.MotionEvent.AXIS_Y);
                    float rx = event.getAxisValue(android.view.MotionEvent.AXIS_Z);
                    float ry = event.getAxisValue(android.view.MotionEvent.AXIS_RZ);
                    float lt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_LTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_BRAKE));
                    float rt = Math.max(event.getAxisValue(android.view.MotionEvent.AXIS_RTRIGGER), event.getAxisValue(android.view.MotionEvent.AXIS_GAS));
                    float hatX = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_X);
                    float hatY = event.getAxisValue(android.view.MotionEvent.AXIS_HAT_Y);
                    boolean isCentered = Math.abs(lx) < 0.08f && Math.abs(ly) < 0.08f && Math.abs(rx) < 0.08f && Math.abs(ry) < 0.08f && lt < 0.05f && rt < 0.05f;
                    boolean hatChanged = Float.compare(hatX, _lastHatX) != 0 || Float.compare(hatY, _lastHatY) != 0;
                    long now = android.os.SystemClock.uptimeMillis();
                    if (!hatChanged) {
                        if (isCentered) {
                            if (_wasCentered) return true;
                            _wasCentered = true;
                        } else {
                            _wasCentered = false;
                            if (now - _lastMotionTime < 14L) return true;
                            if (Math.abs(lx - _lastLX) < 0.015f && Math.abs(ly - _lastLY) < 0.015f && Math.abs(rx - _lastRX) < 0.015f && Math.abs(ry - _lastRY) < 0.015f && Math.abs(lt - _lastLT) < 0.02f && Math.abs(rt - _lastRT) < 0.02f) return true;
                        }
                    }
                    _lastHatX = hatX; _lastHatY = hatY;
                    _lastLX = lx; _lastLY = ly; _lastRX = rx; _lastRY = ry; _lastLT = lt; _lastRT = rt;
                    _lastMotionTime = now;
                }
                return super.dispatchGenericMotionEvent(event);
            }
        }`;
            const lastBrace = code.lastIndexOf('}');
            if (lastBrace !== -1) {
              code = code.slice(0, lastBrace) + extraMethods + '\n';
              fs.writeFileSync(mainAct, code, 'utf8');
            }
          }
        }
        EOF

    - name: Configure Signing and Disable Nano Rust Build
      run: |
        cat << 'EOF' > /tmp/init.gradle
        allprojects {
            tasks.configureEach { task ->
                if (task.name.contains("NanoRust") || task.name.contains("DevRelease") || task.name.contains("DevDebug")) {
                    task.enabled = false
                }
            }
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        buildTypes {
                            release {
                                signingConfig signingConfigs.debug
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleProdRelease -x lint -x test -x syncNanoRustJniLibs --init-script /tmp/init.gradle

    - name: Cortar Peso do APK (Remover x86/x86_64 e Gerar Versoes Ultra-Leves)
      run: |
        set +e
        BT_DIR=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
        BT="$ANDROID_HOME/build-tools/$BT_DIR"
        KS="/tmp/ultralite.keystore"
        rm -f "$KS"
        keytool -genkeypair -v -keystore "$KS" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

        ORIG_APK="android/app/build/outputs/apk/prod/release/app-prod-release.apk"
        OUT_DIR="android/app/build/outputs/apk/prod/release"

        if [ -f "$ORIG_APK" ]; then
          cp "$ORIG_APK" "$OUT_DIR/XStreaming-UltraLeve-TV-32bit-armeabi-v7a.apk"
          cp "$ORIG_APK" "$OUT_DIR/XStreaming-UltraLeve-64bit-arm64-v8a.apk"

          zip -q -d "$ORIG_APK" "lib/x86/*" "lib/x86_64/*" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true
          zip -q -d "$OUT_DIR/XStreaming-UltraLeve-TV-32bit-armeabi-v7a.apk" "lib/x86/*" "lib/x86_64/*" "lib/arm64-v8a/*" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true
          zip -q -d "$OUT_DIR/XStreaming-UltraLeve-64bit-arm64-v8a.apk" "lib/x86/*" "lib/x86_64/*" "lib/armeabi-v7a/*" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true

          for apk in "$OUT_DIR"/*.apk; do
            "$BT/zipalign" -f -p 4 "$apk" "${apk}.aligned" && mv "${apk}.aligned" "$apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android "$apk"
            rm -f "${apk}.idsig"
            echo "APK Pronto: $(basename "$apk") -> $(du -h "$apk" | cut -f1)"
          done
        fi
        exit 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XStreaming-TV-UltraLite-APK
        path: android/app/build/outputs/apk/**/*.apk
